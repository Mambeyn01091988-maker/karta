/* ---------------------------------------------------------------- загрузка */
async function initOnline(){
  if (!ONLINE.enabled){
    renderAuthBar();
    if (THIN) showGate(true);              // тонкий клиент без настроенной базы
    return;
  }
  renderAuthBar();                       // показываем «подключение…», пока грузится библиотека
  try {
    // библиотека встроена в файл; если её нет — берём с CDN
    let factory = (window.supabase && window.supabase.createClient) ? window.supabase : null;
    if (!factory){
      factory = await Promise.race([
        import('https://esm.sh/@supabase/supabase-js@2'),
        new Promise((_, rej) => setTimeout(() => rej(new Error(
          'не удалось загрузить библиотеку Supabase — проверьте интернет')), 12000))
      ]);
    }
    ONLINE.client = factory.createClient(SB.url, SB.anonKey, { auth: { persistSession: true, autoRefreshToken: true } });
    const { data } = await ONLINE.client.auth.getSession();
    ONLINE.user = data && data.session ? data.session.user : null;
    ONLINE.client.auth.onAuthStateChange(async (_e, session) => {
      ONLINE.user = session ? session.user : null;
      ONLINE.profile = null;
      try { await bootSession(); } catch (e) { console.warn(e); }
    });
    subscribeRealtime();
    await bootSession();
  } catch (e) {
    ONLINE.error = e.message || String(e);
    console.warn('Онлайн-режим недоступен:', e);
  }
  renderAuthBar();
}
/* состояние сессии: гость видит пустую карту, заблокированный — экран отказа */
async function bootSession(){
  hideBlocked(); hideGate();
  ONLINE.ready = false;
  if (!ONLINE.user){
    ONLINE.rows = []; ONLINE.assemblies = []; ONLINE.diagrams = [];
    ONLINE.comments = []; ONLINE.photos = [];
    ONLINE.ready = true;
    applyRows([]); refreshAll(); renderAuthBar(); removeWatermark();
    if (THIN) showGate();
    return;
  }
  await loadProfile();
  if (!accessAllowed()){
    ONLINE.rows = []; ONLINE.assemblies = []; ONLINE.diagrams = [];
    ONLINE.ready = true;
    applyRows([]); refreshAll(); renderAuthBar(); removeWatermark();
    showBlocked();
    return;
  }
  try {
    await reloadAll();
    ONLINE.ready = true; ONLINE.offline = false;
    applyRows(ONLINE.rows);
    refreshAll(); renderAuthBar();
    buildWatermark();
    logAccess('open');
    saveCache();                       // сохраняем для работы без интернета
    flushQueue();                      // и досылаем то, что накопилось
    loadMaint();                       // классы помещений, отметки ТО и ТР, календарь
  } catch (e) {
    // нет связи — работаем по сохранённым данным
    const c = loadCache();
    if (!c || !c.rows || !c.rows.length){ ONLINE.error = e.message || String(e); renderAuthBar(); return; }
    ONLINE.rows = c.rows; ONLINE.assemblies = c.assemblies || []; ONLINE.diagrams = c.diagrams || [];
    ONLINE.profile = ONLINE.profile || c.profile || { email: ONLINE.user && ONLINE.user.email, role: 'viewer', active: true };
    ONLINE.ready = true; ONLINE.offline = true;
    applyRows(ONLINE.rows);
    refreshAll(); renderAuthBar(); buildWatermark();
    startOfflineRetry();               // сами проверяем связь каждые 20 секунд
  }
}
async function loadProfile(){
  const { data } = await ONLINE.client.from('profiles').select('*').eq('id', ONLINE.user.id).maybeSingle();
  ONLINE.profile = data || { email: ONLINE.user.email, role: 'viewer', active: false };
}
/* вошедшему разрешено работать только с активным профилем */
function accessAllowed(){
  return !!(ONLINE.user && ONLINE.profile && ONLINE.profile.active === true);
}
async function fetchPaged(table, order){
  const page = 1000;
  let from = 0, out = [];
  for (;;){
    let q = ONLINE.client.from(table).select('*').range(from, from + page - 1);
    if (order) q = q.order(order);
    const { data, error } = await q;
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < page) break;
    from += page;
  }
  return out;
}
async function reloadAll(){
  ONLINE.rows = (await fetchPaged('equipment', 'created_at')).filter(r => !r.deleted_at);
  const [c, p, a, d] = await Promise.all([
    ONLINE.client.from('comments').select('*').order('created_at'),
    ONLINE.client.from('photos').select('*').order('created_at'),
    ONLINE.client.from('assemblies').select('*').order('name'),
    ONLINE.client.from('diagrams').select('*').order('diagram_date')
  ]);
  ONLINE.assemblies = (a.data || []).filter(x => !x.deleted_at);
  ONLINE.diagrams = (d.data || []).filter(x => !x.deleted_at).map(x => ({
    ...x, url: x.path ? ONLINE.client.storage.from(DIAGRAM_BUCKET).getPublicUrl(x.path).data.publicUrl : ''
  }));
  ONLINE.comments = c.data || [];
  ONLINE.photos = (p.data || []).map(x => ({
    ...x,
    url: ONLINE.client.storage.from('equipment-photos').getPublicUrl(x.path).data.publicUrl
  }));
}
function subscribeRealtime(){
  let timer = null;
  const onAny = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try { await reloadAll(); applyRows(ONLINE.rows); refreshAll(); }
      catch (e) { console.warn(e); }
    }, 400);
  };
  ONLINE.client.channel('sk-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'equipment' }, onAny)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, onAny)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'photos' }, onAny)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'assemblies' }, onAny)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'diagrams' }, onAny)
    .subscribe();
}

/* ---------------------- пересборка структуры из строк БД ------------------ */
/* Венткамеры, венткиоски, ВК, вентсбойки, кровля, крыша, фасад — это технические
   помещения для наружных блоков кондиционеров. Собираем их в один раздел. */
const OUTDOOR_GROUP = 'Технические помещения (наружные блоки)';
const OUTDOOR_RE = /вент|кровл|крыш|фасад|сбойк|ниш|пнб|(^|[^а-яa-z])нб([^а-яa-z]|$)|пом\.?\s*нб|(^|\s)вк(\s|$|\d)|п[-.\s]?13(\D|$)/i;
const VK_RE = /(^|[\s.,(№-])вк([\d\s.,)-]|$)/i;
function isOutdoorPlace(place, number){
  const t = `${place || ''} ${number || ''}`;
  return OUTDOOR_RE.test(t) || VK_RE.test(t);
}
function normGroupName(name, place, number){
  return isOutdoorPlace(place, number) ? OUTDOOR_GROUP : (name || 'Служебные помещения');
}
const ROOM_GROUPS_ORDER = ['Северный вестибюль','Южный вестибюль','Восточный вестибюль',
  'Западный вестибюль','Служебные помещения','Технические помещения (наружные блоки)','Депо'];
function roomKeyOf(r){
  const n = (r.room_number || '').trim();
  if (n && n !== '—' && n !== '?') return 'n:' + n.toLowerCase();
  return 'p:' + (r.place || '').toLowerCase();
}
function natKey(v){
  const m = String(v || '').trim().match(/^(\d+)\s*([а-яa-z]*)/i);
  if (m) return [0, +m[1], m[2].toLowerCase()];
  const s = String(v || '').trim();
  if (!s || s === '—' || s === '?') return [2, 0, ''];
  return [1, 0, s.toLowerCase()];
}
function groupOrder(name){
  const i = ROOM_GROUPS_ORDER.indexOf(name);
  return i < 0 ? [1, name.toLowerCase()] : [0, i];
}
function applyRows(rows){
  const byStation = new Map();
  rows.forEach(r => {
    if (!byStation.has(r.station_id)) byStation.set(r.station_id, new Map());
    const groups = byStation.get(r.station_id);
    const gname = normGroupName(r.group_name, r.place, r.room_number);
    if (!groups.has(gname)) groups.set(gname, new Map());
    const rooms = groups.get(gname);
    const rk = roomKeyOf(r);
    if (!rooms.has(rk)) rooms.set(rk, {number: (r.room_number || '—'), place: r.place || '', places: [], systems: []});
    const room = rooms.get(rk);
    if (r.place && room.places.indexOf(r.place) < 0) room.places.push(r.place);
    room.systems.push({
      id: r.id, mark: r.mark, type: r.type, model: r.model, power: r.power,
      inv: r.inv, invNew: r.inv_new, breaker: r.breaker, drain: r.drain, supply: r.supply,
      phone: r.phone, responsible: r.responsible, num: r.num_abkisk,
      state: r.state, installed: r.installed, service: r.service,
      verifiedAt: r.verified_at, verifiedBy: r.verified_by, verifyNote: r.verify_note
    });
  });

  STATIONS.forEach(st => {
    const groups = byStation.get(st.id);
    if (!groups){ st.groups = []; return; }
    st.groups = [...groups.entries()].map(([gname, roomsMap]) => {
      const rooms = [...roomsMap.entries()].map(([rk, room]) => ({
        id: st.id + '::' + gname + '::' + rk,
        number: room.number,
        place: room.places[0] || room.place || '',
        places: room.places.length > 1 ? room.places : undefined,
        systems: room.systems
      })).sort((a, b) => cmpKey(natKey(a.number), natKey(b.number)));
      return {
        id: st.id + '::' + gname,
        name: gname,
        roomCount: rooms.length,
        systemCount: rooms.reduce((n, r) => n + r.systems.length, 0),
        rooms
      };
    }).sort((a, b) => cmpKey(groupOrder(a.name), groupOrder(b.name)));
  });
}
/* встроенный снимок тоже приводим к правилу (на случай старых названий) */
function normalizeEmbeddedGroups(){
  STATIONS.forEach(st => {
    if (!st.groups || !st.groups.length) return;
    const keep = [], merged = [];
    st.groups.forEach(g => {
      g.rooms.forEach(r => {
        if (isOutdoorPlace(r.place, r.number)) merged.push(r); else keep.push({ g, r });
      });
    });
    if (!merged.length) return;
    const rest = keep.reduce((acc, { g, r }) => {
      let grp = acc.find(x => x.name === g.name);
      if (!grp){ grp = { id: g.id, name: g.name, rooms: [] }; acc.push(grp); }
      grp.rooms.push(r);
      return acc;
    }, []);
    rest.forEach(grp => {
      grp.roomCount = grp.rooms.length;
      grp.systemCount = grp.rooms.reduce((n, r) => n + (r.systems || []).length, 0);
    });
    rest.push({
      id: st.id + '::' + OUTDOOR_GROUP, name: OUTDOOR_GROUP,
      roomCount: merged.length,
      systemCount: merged.reduce((n, r) => n + (r.systems || []).length, 0),
      rooms: merged
    });
    st.groups = rest.sort((a, b) => cmpKey(groupOrder(a.name), groupOrder(b.name)));
  });
}
normalizeEmbeddedGroups();

function cmpKey(a, b){
  return (a[0] - b[0])
    || (String(a[1]) < String(b[1]) ? -1 : String(a[1]) > String(b[1]) ? 1 : 0)
    || (String(a[2]) < String(b[2]) ? -1 : String(a[2]) > String(b[2]) ? 1 : 0);
}

/* ------------------------------- сверка ---------------------------------- */
async function setVerified(row, ok){
  const note = ok ? (prompt('Комментарий к сверке (необязательно):', row.verifyNote || '') || '') : '';
  let error = null;
  try {
    const r = await ONLINE.client.rpc('set_verified', { p_id: row.id, p_ok: ok, p_note: note });
    error = r.error;
    if (error){ const q = queued(); q.push({ id: row.id, ok, note, at: Date.now() }); setQueue(q); throw new Error('queued'); }
  } catch (e) {
    if (String(e.message) !== 'queued'){
      const q = queued(); q.push({ id: row.id, ok, note, at: Date.now() }); setQueue(q);
    }
    row.verifiedAt = ok ? new Date().toISOString() : null;

    return;
  }
  await reloadAll(); applyRows(ONLINE.rows); refreshAll();
}

/* =========================================================================
   СБОРКИ И ОДНОЛИНЕЙНЫЕ СХЕМЫ
   Проверка: если дата на схеме старше SCHEMA_MAX_MONTHS месяцев от сегодня —
   схема считается просроченной и подсвечивается красным (на карте тоже).
   ========================================================================= */
const SCHEMA_MAX_MONTHS = 34;              // 2 года 10 месяцев — с этого возраста схема просрочена
const SCHEMA_MAX_LABEL = '2 г 10 мес';     // как показывать порог в текстах
const SCHEMA_WARN_MONTHS = 24;             // с 2 лет — «стареет»
const DIAGRAM_BUCKET = 'diagrams';

function monthsBetween(dateStr){
  if (!dateStr) return null;
  const d = new Date(String(dateStr).slice(0, 10) + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  const now = new Date();
  let m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) m -= 1;
  return Math.max(0, m);
}
function ageText(m){
  if (m == null) return '';
  const y = Math.floor(m / 12), mm = m % 12;
  if (y && mm) return `${y} г ${mm} мес`;
  if (y) return `${y} г`;
  return `${mm} мес`;
}
function diaStatus(m){
  if (m == null) return 'none';
  if (m >= SCHEMA_MAX_MONTHS) return 'bad';        // 2 г 10 мес и старше — красный
  if (m >= SCHEMA_WARN_MONTHS) return 'warn';      // с 2 лет — жёлтый
  return 'ok';
}
function diaBadge(dateStr, short){
  const m = monthsBetween(dateStr);
  const s = diaStatus(m);
  const word = s === 'bad' ? 'просрочена' : s === 'warn' ? 'стареет' : s === 'ok' ? 'актуальна' : 'нет даты';
  return `<span class="badge ${s === 'none' ? 'grey' : s}" title="дата схемы: ${escAttr(dateStr || '—')}">`
    + (short ? word : word + (m != null ? ` · ${ageText(m)}` : '')) + '</span>';
}
const diagramsOfAssembly = (id) => ONLINE.diagrams.filter(d => d.assembly_id === id && !d.deleted_at);
/* службы, которые уже встречаются в книге оборудования — для выпадающего списка */
function serviceOptions(){
  const set = new Set();
  ONLINE.rows.forEach(r => { if (r.service) set.add(String(r.service).trim()); });
  ONLINE.assemblies.forEach(a => { if (a.service) set.add(String(a.service).trim()); });
  return [...set].filter(Boolean).sort((a, b) => a.localeCompare(b, 'ru'));
}
function serviceDatalist(id){
  return `<datalist id="${id}">${serviceOptions().map(v => `<option value="${escAttr(v)}"></option>`).join('')}</datalist>`;
}
function serviceTag(a){
  return a.service ? `<span class="chip svc" title="служба-владелец">${esc(a.service)}</span>` : '';
}
const assembliesOfStation = (sid) => ONLINE.assemblies.filter(a => a.station_id === sid && !a.deleted_at);
function diagramInfoForStation(sid){
  const dias = ONLINE.diagrams.filter(d => d.station_id === sid && !d.deleted_at);
  let worst = 0, overdue = 0;
  dias.forEach(d => {
    const m = monthsBetween(d.diagram_date);
    if (m != null){ worst = Math.max(worst, m); if (m >= SCHEMA_MAX_MONTHS) overdue++; }
  });
  return { count: dias.length, overdue, worst, assemblies: assembliesOfStation(sid).length };
}

function buildWatermark(){
  if (!ONLINE.user){ removeWatermark(); return; }
  const who = wmWho();
  const em = (ONLINE.profile && ONLINE.profile.email) || (ONLINE.user && ONLINE.user.email) || '';
  let wm = document.getElementById('wm'), big = document.getElementById('wmBig');
  if (!wm){ wm = document.createElement('div'); wm.id = 'wm'; wm.className = 'wm'; document.body.appendChild(wm); }
  if (!big){ big = document.createElement('div'); big.id = 'wmBig'; big.className = 'wm-big'; document.body.appendChild(big); }
  const paint = () => {
    const now = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit' });
    wm.textContent = `${who} · ${em} · ${now}`;
    big.innerHTML = '';
    for (let i = 0; i < 9; i++){
      const d = document.createElement('div');
      d.className = 'wm-line';
      d.textContent = `${who} · ${em}`;
      d.style.top = (6 + i * 11) + '%';
      d.style.left = (i % 2 ? '-4%' : '6%');
      big.appendChild(d);
    }
  };
  paint();
  if (window.__wmTimer) clearInterval(window.__wmTimer);
  window.__wmTimer = setInterval(paint, 30000);
  if (!window.__wmWatch){
    window.__wmWatch = new MutationObserver(() => {
      if (!document.body.contains(wm)) document.body.appendChild(wm);
      if (!document.body.contains(big)) document.body.appendChild(big);
    });
    window.__wmWatch.observe(document.body, { childList: true });
  }
}

const CACHE_KEY = 'karta-cache-v1', QUEUE_KEY = 'karta-queue-v1';
function saveCache(){
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      at: Date.now(), profile: ONLINE.profile,
      rows: ONLINE.rows, assemblies: ONLINE.assemblies,
      diagrams: (ONLINE.diagrams || []).map(d => ({ ...d }))
    }));
  } catch (e) { /* места может не хватить — не критично */ }
}
function loadCache(){
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; }
}
function queued(){ try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
function setQueue(q){ try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); } catch (e) {} }
/* отправляем накопленные отметки, когда связь появилась */
async function flushQueue(){
  if (!ONLINE.ready || ONLINE.offline || !ONLINE.user) return;
  const q = queued();
  if (!q.length) return;
  const left = [];
  for (const it of q){
    try {
      const { error } = await ONLINE.client.rpc('set_verified', { p_id: it.id, p_ok: it.ok, p_note: it.note });
      if (error) left.push(it);
    } catch (e) { left.push(it); }
  }
  setQueue(left);
  if (left.length !== q.length){
    await reloadAll(); applyRows(ONLINE.rows); refreshAll();
    alert(`Отправлено отметок: ${q.length - left.length}. Осталось в очереди: ${left.length}.`);
  }
}
window.addEventListener('online', () => { ONLINE.offline = false; flushQueue(); });

/* если связь пропала, пробуем восстановить её сами */
let offlineTimer = null;
async function retryOnline(){
  if (!ONLINE.user) return false;
  try {
    await loadProfile();
    if (!accessAllowed()) return false;
    await reloadAll();
    ONLINE.ready = true; ONLINE.offline = false;
    applyRows(ONLINE.rows); refreshAll(); renderAuthBar();
    saveCache(); flushQueue(); loadMaint();
    if (offlineTimer){ clearInterval(offlineTimer); offlineTimer = null; }
    return true;
  } catch (e) { return false; }
}
window.retryOnline = retryOnline;
function startOfflineRetry(){
  if (offlineTimer) return;
  offlineTimer = setInterval(() => { retryOnline(); }, 20000);
}

function shortAgent(ua){
  const s = String(ua || '');
  if (/iPhone|iPad/i.test(s)) return 'iPhone / iPad';
  if (/Android/i.test(s)) return 'Android';
  if (/Macintosh/i.test(s)) return 'Mac';
  if (/Windows/i.test(s)) return 'Windows';
  if (/Linux/i.test(s)) return 'Linux';
  return s.slice(0, 30) || '—';
}
function downloadCsv(text, name){
  const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ------------------- укомплектованность сборки и срок годности ----------- */
function datePlusMonths(dateStr, m){
  const d = new Date(String(dateStr).slice(0, 10) + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  const day = d.getDate();
  d.setMonth(d.getMonth() + m);
  if (d.getDate() < day) d.setDate(0);
  return d.toISOString().slice(0, 10);
}
/* самая старая схема определяет срок годности сборки */
function assemblyExpiry(a){
  const dias = diagramsOfAssembly(a.id).filter(d => d && d.diagram_date);
  if (!dias.length) return null;
  let oldest = dias[0];
  dias.forEach(d => { if ((monthsBetween(d.diagram_date) || 0) > (monthsBetween(oldest.diagram_date) || 0)) oldest = d; });
  const age = monthsBetween(oldest.diagram_date) || 0;
  return { oldest, age, left: SCHEMA_MAX_MONTHS - age, date: datePlusMonths(oldest.diagram_date, SCHEMA_MAX_MONTHS) };
}
const fmtDate = (s) => { const p = String(s || '').slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : (s || '—'); };

function assemblyCompleteness(a){
  const dias = diagramsOfAssembly(a.id);
  const withFile = dias.filter(d => d.path).length;
  const expired = dias.filter(d => monthsBetween(d.diagram_date) >= SCHEMA_MAX_MONTHS).length;
  const f = fireStatusOf(a);
  const checks = [
    { label: 'Заведены однолинейные схемы', ok: dias.length > 0, weight: 30 },
    { label: 'Нет просроченных схем', ok: dias.length > 0 && expired === 0, weight: 25 },
    { label: 'К схемам приложены файлы', ok: dias.length > 0 && withFile === dias.length, weight: 10 },
    { label: 'Указана служба-владелец', ok: !!a.service, weight: 10 },
    { label: 'Указан ответственный', ok: !!a.responsible, weight: 5 },
    { label: 'Установлено пожаротушение (Парабола/Гипербола)', ok: f.code !== 'none', weight: 10 },
    { label: 'Пожаротушение укомплектовано', ok: a.fire_complete === true, weight: 5 },
    { label: 'Срок годности пожаротушения не истёк', ok: f.code === 'ok' || f.code === 'warn', weight: 5 }
  ];
  const pct = checks.reduce((n, c) => n + (c.ok ? c.weight : 0), 0);
  return { pct, checks, expired, total: dias.length };
}
/* «Парабола» / «Гипербола» — автономные установки пожаротушения */
const FIRE_SYSTEMS = ['Парабола', 'Гипербола'];
function fireLeftText(exp){
  const left = daysUntil(exp);
  if (left == null) return 'нет данных';
  if (left < 0) return `просрочено на ${ageText(Math.round(-left / 30.44))}`;
  return `осталось ${ageText(Math.round(left / 30.44))}`;
}
function fireStatusOf(a){
  const sys = String(a.fire_system || a.fireSystem || '').trim();
  const exp = a.fire_expiry || a.fireExpiry || '';
  if (a.fireState === 'не установлена' || a.fireState === 'не наша сборка') return { code: 'bad', label: a.fireState };
  if (a.fireState === 'нет данных') return { code: 'warn', label: 'нет данных о пожаротушении' };
  if (exp){
    const left = daysUntil(exp);
    if (left != null){
      if (left < 0) return { code: 'bad', label: `срок годности истёк ${fmtDate(exp)}` };
      if (left < 183) return { code: 'warn', label: `истекает ${fmtDate(exp)}` };
    }
  }
  if (a.fireState === 'установлена') return { code: 'ok', label: 'установлена' };
  if (!sys || /^нет$/i.test(sys)) return { code: 'none', label: 'не установлено' };
  const left = a.fire_expiry ? daysUntil(a.fire_expiry) : null;
  if (left == null) return { code: 'nodate', label: 'нет срока годности' };
  if (left < 0) return { code: 'bad', label: `просрочено на ${Math.abs(Math.round(left / 30))} мес` };
  if (left < 183) return { code: 'warn', label: `истекает через ${Math.max(1, Math.round(left / 30))} мес` };
  return { code: 'ok', label: 'в порядке' };
}
function daysUntil(dateStr){
  const d = new Date(String(dateStr).slice(0, 10) + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  const now = new Date();
  const a = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d - a) / 86400000);
}
function fireBadge(a){
  const f = fireStatusOf(a);
  const sys = a.fire_system || a.fireSystem || 'Пожаротушение';
  const mdl = a.fire_model || a.fireModel || '';
  const note = a.fire_note || a.fireNote || '';
  const cls = f.code === 'ok' ? 'ok' : f.code === 'warn' ? 'warn' : f.code === 'bad' ? 'bad' : 'grey';
  return `<span class="badge ${cls}" title="${escAttr((mdl || sys) + (note ? ' · ' + note : ''))}">
    ${esc(sys)}${mdl ? ' ' + esc(mdl) : ''} · ${esc(f.label)}</span>`;
}
function firePanel(a){
  const f = fireStatusOf(a);

      : (fstate === 'установлена' ? 'да (по списку)' : '—')],
    ['Дата установки / акта', fdate ? fmtDate(fdate) : '—'],

  ];
  return `<div class="fire ${f.code}">

      <table class="tbl" style="margin-top:6px">${rows.map(([k, v]) =>
        `<tr><th style="width:170px;position:static">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</table>
      ${a.fire_expiry ? `<div class="note">Проверка срока годности идёт от сегодняшнего дня:
        осталось ${ageText(Math.max(0, Math.round((daysUntil(a.fire_expiry) || 0) / 30.44)))}${f.code === 'bad' ? ' — срок истёк' : ''}.</div>` : ''}
    </div>`;
}
function gaugeColor(pct){ return pct >= 80 ? '#12805c' : pct >= 50 ? '#c98a00' : '#c62828'; }
function gaugeSVG(pct){
  const len = Math.PI * 42;
  const dash = (len * Math.max(0, Math.min(100, pct)) / 100).toFixed(1);
  return `<svg viewBox="0 0 100 62" class="gauge" role="img" aria-label="укомплектовано ${pct}%">
      <path d="M 8 50 A 42 42 0 0 1 92 50" class="g-bg"/>
      <path d="M 8 50 A 42 42 0 0 1 92 50" class="g-fg" stroke="${gaugeColor(pct)}"
            stroke-dasharray="${dash} ${len.toFixed(1)}"/>
      <text x="50" y="44" text-anchor="middle" class="g-val">${pct}%</text>
      <text x="50" y="57" text-anchor="middle" class="g-cap">укомплектовано</text>
    </svg>`;
}
function completenessPanel(a){
  const c = assemblyCompleteness(a);
  const exp = assemblyExpiry(a);
  const expText = !exp
    ? '<span class="chk no">Срок годности не определён — нет схем</span>'
    : (exp.left >= 0
      ? `Срок годности схем: до <b>${fmtDate(exp.date)}</b> · осталось <b>${ageText(exp.left)}</b>`
      : `<b style="color:var(--bad)">Схемы просрочены на ${ageText(-exp.left)}</b> (срок истёк ${fmtDate(exp.date)})`);
  return `<div class="compl ${c.pct >= 80 ? 'ok' : c.pct >= 50 ? 'warn' : 'bad'}">
      ${gaugeSVG(c.pct)}
      <div class="compl-list">
        ${c.checks.map(x => `<div class="${x.ok ? 'chk' : 'chk no'}">${x.ok ? '✓' : '○'} ${esc(x.label)}
          <span class="compl-w">${x.weight}%</span></div>`).join('')}
        <div class="compl-exp">${expText}</div>
      </div>
    </div>`;
}

function openDiagram(d){
  if (d && d.img){
    eCrumb.innerHTML = 'Однолинейная схема';
    eTitle.textContent = d.title || 'Однолинейная схема';
    eSub.innerHTML = `дата схемы: <b>${fmtDate(d.date)}</b> ${diaBadge(d.date)} · прокрутите изображение, чтобы посмотреть схему целиком`;
    eBody.innerHTML = `<div style="max-height:72vh;overflow:auto;border:1px solid var(--border);
        border-radius:10px;background:#fff"><img src="${escAttr(d.img)}" alt="однолинейная схема"
        style="width:100%;display:block"></div>`;
    eFoot.innerHTML = `<button class="btn" id="diaClose">Закрыть</button>`
      + (d.file ? `<span class="spacer"></span><a class="btn" href="${escAttr(d.file)}" download>Скачать PDF</a>` : '');
    $('diaClose').onclick = closeEdit;
    $('editOverlay').classList.add('open');
    return;
  }
  if (d && d.url){
    // на телефонах всплывающие окна часто блокируются — тогда открываем в этой же вкладке
    let w = null;
    try { w = window.open(d.url, '_blank'); } catch (e) { w = null; }
    if (!w){
      eCrumb.innerHTML = 'Однолинейная схема';
      eTitle.textContent = d.title || 'Однолинейная схема';
      eSub.innerHTML = 'Если схема не открылась автоматически — нажмите кнопку ниже';
      eBody.innerHTML = `<div class="empty">Файл схемы: <b>${esc((d.path || '').split('/').pop() || 'PDF')}</b><br>
        <a class="btn primary" href="${escAttr(d.url)}" target="_blank" rel="noopener"
           style="display:inline-block;margin-top:12px;text-decoration:none">Открыть схему</a>
        <div style="margin-top:10px"><a href="${escAttr(d.url)}" download>Скачать PDF</a></div></div>`;
      eFoot.innerHTML = `<button class="btn" id="diaBack2">← Назад</button>`;
      $('diaBack2').onclick = closeEdit;
      $('editOverlay').classList.add('open');
    }
    return;
  }
  const src = d && d.data;
  if (!src){
    if (d && d.file) window.open(encodeURI(d.file), '_blank');
    else alert('Файл схемы не найден в данных карты');
    return;
  }
  try {
    const bin = atob(src.split(',')[1]);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([buf], { type: 'application/pdf' }));
    const w = window.open(url, '_blank');
    if (!w){
      eCrumb.innerHTML = 'Однолинейная схема';
      eTitle.textContent = d.title || 'Однолинейная схема';
      eSub.textContent = 'Просмотр схемы. Закройте окно, чтобы вернуться на карту.';
      eBody.innerHTML = `<iframe src="${escAttr(url)}" style="width:100%;height:70vh;border:1px solid var(--border);border-radius:10px"></iframe>`;
      eFoot.innerHTML = `<button class="btn" id="diaClose">Закрыть</button>`;
      $('diaClose').onclick = () => { URL.revokeObjectURL(url); closeEdit(); };
      $('editOverlay').classList.add('open');
    } else setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { alert('Не удалось открыть схему: ' + e.message); }
}

const TO_RULES = { heat:{to:14, tr:90, title:'с теплоизбытками'}, cold:{to:30, tr:180, title:'без теплоизбытков'}, depot:{to:365, tr:180, title:'депо, АБК'} };
ONLINE.classes = Object.create(null);
ONLINE.mlast = Object.create(null);
ONLINE.maint = [];
ONLINE.hol = null;
ONLINE.maintLoaded = false;

function isoLocal(d){ const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parseIso(s){ const a = String(s).slice(0,10).split('-').map(Number); return new Date(a[0], a[1]-1, a[2]); }
function addDaysD(d,n){ const x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function isWorkday(d){
  const k = isoLocal(d);
  if (ONLINE.hol){
    if (ONLINE.hol.work.has(k)) return true;
    if (ONLINE.hol.nowork.has(k)) return false;
  }
  const w = d.getDay(); return w !== 0 && w !== 6;
}
function workdayBefore(d){ let x = new Date(d.getTime()); for (let i=0;i<40;i++){ if (isWorkday(x)) return x; x = addDaysD(x,-1); } return d; }

async function loadMaint(){
  if (!ONLINE.client) return;
  try {
    const [rc, ml, hl] = await Promise.all([
      ONLINE.client.from('room_class').select('station_id,room_number,class').limit(5000),
      ONLINE.client.from('maintenance').select('id,station_id,room_number,kind,done_at,note,file_path,file_name,file_type,done_email').order('done_at',{ascending:false}).limit(3000),
      ONLINE.client.from('holidays').select('day,kind').limit(1000)
    ]);
    (rc.data||[]).forEach(x => { ONLINE.classes[x.station_id+'|'+x.room_number] = x.class; });
    ONLINE.maint = ml.data || [];
    ONLINE.mlast = Object.create(null);
    ONLINE.maint.forEach(m => {
      const k = m.station_id+'|'+m.room_number+'|'+m.kind;
      if (!ONLINE.mlast[k] || String(m.done_at) > String(ONLINE.mlast[k].done_at)) ONLINE.mlast[k] = m;
    });
    const nowork = new Set(), work = new Set();
    (hl.data||[]).forEach(x => { if (x.kind === 'workday') work.add(x.day); else if (x.kind !== 'short') nowork.add(x.day); });
    ONLINE.hol = { nowork, work };
    ONLINE.maintLoaded = true;
  } catch(e){ ONLINE.maintLoaded = false; }
}
function classOf(sid, room){ return ONLINE.classes[sid+'|'+room] || 'cold'; }
function statusOf(sid, room, kind){
  const cls = classOf(sid, room), r = TO_RULES[cls] || TO_RULES.cold;
  const iv = (kind === 'ТО') ? r.to : r.tr;
  const last = ONLINE.mlast[sid+'|'+room+'|'+kind];
  if (!last) return { cls, iv, last:null, due:null, diff:null, state:'none' };
  const due = workdayBefore(addDaysD(parseIso(last.done_at), iv));
  const diff = Math.round((due - parseIso(isoLocal(new Date()))) / 86400000);
  return { cls, iv, last, due: isoLocal(due), diff, state: diff < 0 ? 'late' : (diff <= 7 ? 'soon' : 'ok') };
}
const TO_STATE = { none:{t:'не начато', c:'#8b98a8', bg:'#eef2f6'}, ok:{t:'в срок', c:'#1a7f4b', bg:'#e6f5ec'},
  soon:{t:'на этой неделе', c:'#9a6b00', bg:'#fff4d6'}, late:{t:'просрочено', c:'#b3261e', bg:'#fde8e6'} };

function toRooms(){
  const map = new Map();
  (ONLINE.rows||[]).forEach(r => {
    const k = r.station_id + '|' + (r.room_number || '');
    if (!map.has(k)) map.set(k, { sid:r.station_id, room:r.room_number || '', place:r.place || '', group:r.group_name || '', units:0 });
    map.get(k).units++;
  });
  return [...map.values()];
}
function stationNameOf(sid){
  const st = (typeof STATIONS !== 'undefined' ? STATIONS : []).find(s => s.id === sid);
  return st ? st.name : sid;
}
function toRows(){
  return toRooms().map(x => {
    const to = statusOf(x.sid, x.room, 'ТО'), tr = statusOf(x.sid, x.room, 'ТР');
    const rank = (s) => s === 'late' ? 0 : (s === 'soon' ? 1 : (s === 'none' ? 2 : 3));
    return { ...x, to, tr, rank: Math.min(rank(to.state), rank(tr.state)) };
  });
}

    const sts = STATIONS.filter(s => s.lineId === l.id && (s.groups || []).length);
    if (!sts.length) return '';
    return `<div class="lv-line"><div class="lv-head"><i style="background:${esc(l.color)}"></i>${esc(l.name)}
        <b>${sts.length} станций</b></div>
      ${sts.map(s => { const c = stationCounts(s);
        return `<button class="lv-st" data-st="${escAttr(s.id)}"><span class="nm">${esc(s.name)}</span>
          <span class="ct">${c.rooms} пом. · ${c.units} ед.${c.bad ? ' · <b style="color:var(--bad)">' + c.bad + ' неиспр.</b>' : ''}</span></button>`; }).join('')}</div>`;
  };
  const depots = STATIONS.filter(s => s.offMap && (s.groups || []).length);
  if (!STATIONS.length){
    box.innerHTML = '<div class="empty">Загружаем данные…</div>';
    return;
  }
  const top = `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <button class="btn primary" id="toMapBtn" style="padding:10px 16px">☰ Карта</button>
      <b style="font-size:16px">Станции по линиям</b></div>`;
  box.innerHTML = top + LINES.map(line).join('') + (depots.length ? `<div class="lv-line">
      <div class="lv-head"><i style="background:#8b98a8"></i>Депо, АБК и объекты<b>${depots.length}</b></div>
      ${depots.map(s => { const c = stationCounts(s);
        return `<button class="lv-st" data-st="${escAttr(s.id)}"><span class="nm">${esc(s.name)}</span>
          <span class="ct">${c.rooms} пом. · ${c.units} ед.</span></button>`; }).join('')}</div>` : '');
  const mb = $('toMapBtn');
  if (mb) mb.onclick = () => setView('map');
  box.querySelectorAll('[data-st]').forEach(b => b.onclick = () => {
    const st = STATIONS.find(s => s.id === b.dataset.st);
    if (st) gotoStation(st, { forceCard:true });
  });
}
function setView(mode){
  viewMode = mode;
  try { localStorage.setItem('karta-view', mode); } catch (e) {}
  document.body.classList.toggle('listmode', mode === 'list');
  const b = $('viewToggle');
  if (b) b.textContent = mode === 'list' ? '☰ Карта' : '☰ Список';
  if (mode === 'list') renderList();
}
function ensureViewUI(){
  if (!$('listView')){
    const v = document.createElement('div'); v.id = 'listView';
    const host = $('mapArea') ? $('mapArea').parentElement : document.body;
    host.insertBefore(v, $('mapArea'));
  }
  if (!$('viewToggle')){
    // в шапке карты — обычная кнопка, в режиме списка — плавающая поверх экрана
    const tb = document.querySelector('.map-toolbar');
    const b = document.createElement('button');
    b.id = 'viewToggle';
    b.title = 'Карта или список станций';
    b.onclick = () => setView(viewMode === 'list' ? 'map' : 'list');
    if (tb){ b.className = 'zbtn'; tb.appendChild(b); }
    else { document.body.appendChild(b); }
    if (!$('viewToggleFloat')){
      const f = document.createElement('button');
      f.id = 'viewToggleFloat'; f.textContent = '☰ Карта';
      f.onclick = () => setView('map');
      document.body.appendChild(f);
    }
  }
  if (viewMode === 'list') setView('list');
}

async function openTO(){
  if (!ONLINE.ready){ alert('Сначала войдите в карту.'); return; }
  if (!ONLINE.maintLoaded) await loadMaint();
  let ov = $('toOverlay');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'toOverlay';
    ov.style.cssText = 'position:fixed;inset:0;z-index:90;background:#fff;overflow:auto;'
      + 'padding:16px 16px calc(80px + env(safe-area-inset-bottom, 0px))';
    document.body.appendChild(ov);
  }
  ov.style.display = 'block';
  drawTO();
}
function openMarkForm(sid, room, kind){
  const ov = $('toOverlay'); if (!ov) return;
  const cls = classOf(sid, room), r = TO_RULES[cls] || TO_RULES.cold;
  const st = statusOf(sid, room, kind);
  ov.innerHTML = `<div style="max-width:620px;margin:0 auto">
    <h2 style="margin:0 0 4px;font-size:19px">${kind} — ${esc(stationNameOf(sid))}, пом. ${esc(room || '—')}</h2>
    <div style="color:#6b7885;font-size:13px;margin-bottom:14px">${r.title} · ${kind === 'ТО' ? r.to + ' дней' : r.tr + ' дней'}
      ${st.last ? ' · последнее: ' + String(st.last.done_at).split('-').reverse().join('.') : ''}</div>
    <div style="display:grid;gap:12px">
      <label style="display:grid;gap:5px;font-size:13px;color:#4a5866">Дата выполнения
        <input id="mkDate" type="date" value="${isoLocal(new Date())}" style="padding:10px 12px;border:1px solid #cdd7e2;border-radius:10px;font-size:15px"></label>
      <label style="display:grid;gap:5px;font-size:13px;color:#4a5866">Примечание
        <input id="mkNote" type="text" placeholder="необязательно" style="padding:10px 12px;border:1px solid #cdd7e2;border-radius:10px;font-size:15px"></label>
      <label style="display:grid;gap:5px;font-size:13px;color:#4a5866">
        ${kind === 'ТР' ? '<b>Протокол ТР — обязателен</b> (фото или PDF)' : 'Файл (необязательно)'}
        <input id="mkFile" type="file" accept="image/*,application/pdf" capture="environment" style="font-size:14px">
        <span style="font-size:12px;color:#8b98a8">На телефоне можно снять камерой или выбрать PDF из файлов</span></label>
    </div>
    <div id="mkErr" style="color:#b3261e;font-size:13px;margin-top:10px"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn primary" id="mkSave" style="padding:12px 22px;font-size:15px">Сохранить</button>
      <button class="btn" id="mkBack" style="padding:12px 22px;font-size:15px">← Назад</button>
    </div></div>`;
  $('mkBack').onclick = drawTO;
  $('mkSave').onclick = async () => {
    const date = $('mkDate').value, note = $('mkNote').value.trim();
    const file = ($('mkFile').files || [])[0];
    const err = $('mkErr'); err.textContent = '';
    if (!date){ err.textContent = 'Укажите дату'; return; }
    if (kind === 'ТР' && !file){ err.textContent = 'Для ТР нужно приложить протокол (фото или PDF)'; return; }
    $('mkSave').disabled = true; $('mkSave').textContent = 'Сохраняем…';
    let file_path = null, file_type = null, file_name = null;
    try {
      if (file){
        if (file.size > 12 * 1024 * 1024){ throw new Error('Файл больше 12 МБ — уменьшите фото'); }
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
        file_path = 'maintenance/' + sid + '/' + (room || 'room').replace(/[^\w.-]+/g, '_') + '/' + kind + '-' + Date.now() + '.' + ext;
        const up = await ONLINE.client.storage.from('equipment-photos').upload(file_path, file, { upsert:false });
        if (up.error) throw new Error('Не удалось загрузить файл: ' + up.error.message);
        file_type = (file.type || '').includes('pdf') ? 'pdf' : 'photo';
        file_name = file.name;
      }
      const ins = await ONLINE.client.from('maintenance').insert({
        station_id: sid, room_number: room || '', kind, done_at: date, note,
        done_by: ONLINE.user && ONLINE.user.id, done_email: ONLINE.profile ? ONLINE.profile.email : '',
        file_path, file_type, file_name
      });
      if (ins.error) throw new Error(ins.error.message);
      await loadMaint(); drawTO();
      alert(kind + ' отмечено: ' + date.split('-').reverse().join('.'));
    } catch (e) {
      $('mkSave').disabled = false; $('mkSave').textContent = 'Сохранить';
      err.textContent = e.message || 'Не удалось сохранить';
    }
  };
}

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
function ensureTOButton(){
  if ($('btnTO')) return;
  // кнопка появляется рядом с «Войти» или «Выйти» — что есть в шапке
  const anchor = $('btnIn') || $('btnOut');
  const host = anchor && anchor.parentElement;
  if (!anchor || !host) return;
  const b = document.createElement('button');
  b.id = 'btnTO';
  b.className = anchor.className || 'btn';
  b.textContent = 'ТО и ТР';
  b.onclick = openTO;
  host.insertBefore(b, anchor);
}
/* сворачивание панелей: на телефоне карта сразу чистая */
(function(){
  const KEY = 'karta-panels';
  let val = null;
  try { val = localStorage.getItem(KEY); } catch (e) {}
  if (val === null) val = (window.innerWidth <= 760) ? '1' : '0';
  const b = document.createElement('button');
  b.id = 'panelToggle';
  const paint = () => { b.textContent = document.body.classList.contains('clean') ? '▾ Панели' : '▴ Скрыть'; };
  b.onclick = () => {
    const on = document.body.classList.toggle('clean');
    try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
    paint();
  };
  if (val === '1') document.body.classList.add('clean');
  paint();
  document.body.appendChild(b);
})();
ensureTOButton();
ensureViewUI();
try { new MutationObserver(ensureTOButton).observe(document.body, { childList:true, subtree:true }); } catch (e) {}
initOnline();

</script>
