<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Интерактивная карта метро — системы кондиционирования</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#101720; --ink-2:#3b4756; --muted:#69788c;
    --border:#dbe2ea; --accent:#1f6fb2;
    --ok:#12805c; --ok-bg:#e2f5ee; --warn:#9a6100; --warn-bg:#fdf1dc;
    --bad:#b3261e; --bad-bg:#fdeceb; --grey:#5b6472; --grey-bg:#eceff3;
    --shadow:0 10px 30px rgba(16,23,32,.14);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  button{font:inherit; color:inherit}

  /* ---------- шапка ---------- */
  .topbar{
    background:linear-gradient(180deg,#131b26,#0d1319); color:#fff;
    padding:13px 20px; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center;
    box-shadow:0 2px 14px rgba(0,0,0,.28); position:relative; z-index:30;
  }
  .brand{display:flex; align-items:center; gap:12px; flex:1 1 420px; min-width:260px}
  .logo{width:44px;height:44px;border-radius:12px;background:#1f6fb2;color:#fff;display:grid;place-items:center;
        font-weight:800;font-size:19px;flex:none;box-shadow:0 4px 14px rgba(31,111,178,.45)}
  .brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.1px}
  .brand p{margin:2px 0 0;font-size:12.5px;color:#9fb0c4}
  .search-wrap{position:relative; flex:1 1 320px; max-width:520px}
  #search{
    width:100%; padding:11px 14px 11px 38px; border-radius:10px; border:1px solid #2a3644;
    background:#1c2632; color:#fff; font:inherit; outline:none;
  }
  #search::placeholder{color:#8092a6}
  #search:focus{border-color:#4d6076; background:#212d3b}
  .search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#8092a6;font-size:14px}
  #searchResults{
    position:absolute; top:calc(100% + 8px); left:0; right:0; background:#fff; color:var(--ink);
    border-radius:12px; box-shadow:var(--shadow); overflow:auto; max-height:60vh; display:none; z-index:50;
  }
  #searchResults.open{display:block}
  .sr-item{padding:9px 13px; border-bottom:1px solid #eef1f5; cursor:pointer; display:flex; gap:10px; align-items:baseline}
  .sr-item:last-child{border-bottom:0}
  .sr-item:hover{background:#f6f8fb}
  .sr-kind{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#fff;background:#8d9aab;border-radius:5px;padding:2px 6px;flex:none}
  .sr-kind.st{background:var(--accent)} .sr-kind.rm{background:#2f6fb0} .sr-kind.eq{background:#5b6472}
  .sr-main{font-size:14px}
  .sr-sub{font-size:12px;color:var(--muted)}
  .sr-empty{padding:14px;color:var(--muted);font-size:13.5px}

  /* ---------- легенда и статистика ---------- */
  .stats{
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:8px 20px; display:flex; gap:10px 14px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--ink-2);
  }
  .stat b{font-size:15px; color:var(--ink)}
  .stat span{color:var(--muted)}
  .line-chip{
    display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:#fff;
    border-radius:999px; padding:4px 11px 4px 7px; cursor:pointer; font-size:12.5px; transition:.14s;
  }
  .line-chip i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
  .line-chip b{font-weight:700;color:var(--muted);font-size:12px}
  .line-chip:hover{border-color:#b9c6d4; background:#f7f9fc}
  .line-chip.on{border-color:var(--accent); background:#eaf2fa; box-shadow:0 0 0 1px var(--accent) inset}
  .line-chip.on b{color:var(--accent)}
  .stats .spacer{flex:1}
  .btn{border:1px solid var(--border); background:#fff; border-radius:9px; padding:7px 12px; cursor:pointer; font-size:13.5px; color:var(--ink-2); transition:.14s}
  .btn:hover{background:#f4f7fa; border-color:#c6d1dd}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.primary:hover{filter:brightness(.94)}

  /* ---------- карта ---------- */
  main{flex:1 1 auto; min-height:0; display:flex}
  .map-area{position:relative; flex:1 1 auto; overflow:hidden; background:
    radial-gradient(circle at 30% 10%, #ffffff 0%, #f7f9fc 45%, #e9eef4 100%)}
  #map{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
  #map.dragging{cursor:grabbing}
  .map-toolbar{
    position:absolute; top:14px; left:16px; display:flex; gap:8px; align-items:center;
    background:rgba(255,255,255,.93); backdrop-filter:blur(6px); border:1px solid var(--border);
    border-radius:12px; padding:7px 10px; box-shadow:0 4px 16px rgba(16,23,32,.08); z-index:10;
    flex-wrap:wrap; max-width:calc(100% - 32px);
  }
  .zbtn{height:32px;min-width:32px;padding:0 9px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:13px}
  .zbtn:hover{background:#f2f5f9}
  .hint{font-size:12px;color:var(--muted);padding-left:4px}
  #map text{font-family:inherit}
  .st-label{fill:#20303f; pointer-events:none; paint-order:stroke; stroke:#fff; stroke-width:2.6px; stroke-linejoin:round}
  .st-label.hi{fill:#101720; font-weight:700}
  .station{cursor:pointer}
  .station .hit{fill:#fff; fill-opacity:.001; pointer-events:all}
  .station circle.body{fill:#fff}
  .station.dim{opacity:.16}
  .line-path{fill:none; stroke-linecap:round; stroke-linejoin:round}
  .line-path.dim{opacity:.13}
  .depot-link{stroke:#aebbc9; stroke-dasharray:4 4; fill:none}
  .depot-chip{fill:#eef2f7; stroke:#a9b8c8}
  .depot-text{fill:#3b4756; font-weight:600; pointer-events:none; user-select:none}
  .station.depot:hover .depot-chip{fill:#e2ebf5; stroke:var(--accent)}
  .station.depot:hover .depot-text{fill:var(--accent)}
  .connections line{transition:opacity .14s}
  .connections line.dim{opacity:.13}
  .lbl-line{font-weight:700; paint-order:stroke; stroke:#fff; stroke-width:3px; stroke-linejoin:round}
  #tooltip{
    position:absolute; pointer-events:none; background:#131b26; color:#fff; padding:7px 10px;
    border-radius:9px; font-size:12.5px; line-height:1.35; opacity:0; transition:opacity .12s;
    transform:translate(-50%,-135%); white-space:nowrap; z-index:20; box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  #tooltip small{color:#a9b8c9}
  footer{padding:7px 20px; font-size:12px; color:var(--muted); background:var(--panel); border-top:1px solid var(--border); display:flex; gap:14px; flex-wrap:wrap; align-items:center}
  .demo-warn{color:var(--bad); font-weight:600}

  /* ---------- модальное окно ---------- */
  .overlay{position:fixed; inset:0; background:rgba(13,19,25,.55); display:none; align-items:center; justify-content:center; padding:24px; z-index:100}
  .overlay.open{display:flex}
  .modal{background:var(--panel); border-radius:16px; box-shadow:var(--shadow); width:min(1330px,100%);
         max-height:min(90vh,900px); display:flex; flex-direction:column; overflow:hidden; animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(8px) scale(.99); opacity:.4}to{transform:none;opacity:1}}
  .m-head{padding:16px 22px 12px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,#fff,#fafbfd)}
  .m-top{display:flex; align-items:flex-start; gap:14px}
  .m-title{flex:1}
  .m-title h2{margin:0; font-size:20px}
  .m-title .sub{font-size:13px; color:var(--muted); margin-top:3px}
  .crumb{font-size:12.5px; color:var(--muted); margin-bottom:7px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .crumb button{background:none;border:0;padding:0;cursor:pointer;color:#2f6fb0;font:inherit;font-size:12.5px}
  .crumb button:hover{text-decoration:underline}
  .crumb .cur{color:var(--ink-2); font-weight:600}
  .x{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:17px;line-height:1;flex:none}
  .x:hover{background:#f2f5f9}
  .steps{margin-top:10px; font-size:12.5px; color:var(--ink-2); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .pip{display:inline-flex; gap:6px; align-items:center}
  .pip i{width:18px;height:18px;border-radius:50%;background:#e7ecf2;color:var(--muted);display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:700}
  .pip.done i{background:var(--ok-bg); color:var(--ok)}
  .pip.now i{background:var(--accent); color:#fff}
  .chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:9px}
  .chip{background:#f1f4f8; border:1px solid #e2e8ef; color:var(--ink-2); border-radius:999px; padding:3px 10px; font-size:12.5px}
  .m-body{padding:16px 22px 22px; overflow:auto}
  .m-foot{padding:11px 22px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#fafbfd}
  .m-foot .spacer{flex:1}
  .grid{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  .card{text-align:left; border:1px solid var(--border); border-radius:12px; background:#fff; padding:13px 14px; cursor:pointer; transition:.14s; display:flex; flex-direction:column; gap:6px}
  .card:hover{border-color:var(--accent); box-shadow:0 6px 18px rgba(16,23,32,.09); transform:translateY(-1px)}
  .card .c-top{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .card .c-name{font-weight:650; font-size:15px}
  .card .c-sub{font-size:12.5px; color:var(--muted)}
  .card .c-meta{font-size:12.5px; color:var(--ink-2); display:flex; gap:10px; flex-wrap:wrap}
  .rooms{display:grid; gap:9px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .room{border:1px solid var(--border); border-radius:11px; background:#fff; padding:10px 11px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:3px; transition:.14s}
  .room:hover{border-color:var(--accent); background:#f8fbff}
  .room .r-num{font-size:17px; font-weight:750; letter-spacing:.4px}
  .room .r-purpose{font-size:12px; color:var(--ink-2); line-height:1.3; min-height:31px}
  .room .r-badge{font-size:11.5px; align-self:flex-start; border-radius:6px; padding:1px 7px; background:var(--ok-bg); color:var(--ok); font-weight:600}
  .room .r-badge.none{background:var(--grey-bg); color:var(--grey)}
  .room .more{color:var(--accent); font-weight:700}
  .room .r-badge.hit{background:#fdeceb; color:#a71d0f}
  .filter-row{display:flex; gap:10px; align-items:center; margin:0 0 13px; flex-wrap:wrap}
  .filter-row input{padding:8px 11px; border:1px solid var(--border); border-radius:9px; font:inherit; min-width:220px; outline:none}
  .filter-row input:focus{border-color:#9fb3c8}
  table.tbl{width:100%; border-collapse:separate; border-spacing:0; font-size:12.5px}
  table.tbl th,table.tbl td{border-bottom:1px solid #e8edf3; padding:8px 9px; text-align:left; vertical-align:top}
  table.tbl th{background:#f6f8fb; font-size:11.5px; text-transform:uppercase; letter-spacing:.35px; color:var(--muted); white-space:nowrap}
  /* шапка таблицы остаётся на виду при прокрутке списка */
  table.tbl thead th{position:sticky; top:0; z-index:3; background:#f2f6fa;
    box-shadow:inset 0 -1px 0 #dbe3ec, inset 0 1px 0 #e8eef5}
  @media (max-width:760px){ table.tbl thead th{background:#eef3f9} }
  table.tbl tbody tr:hover{background:#f9fbfd}
  table.tbl tr.mark{background:#fff6d9 !important; box-shadow:inset 3px 0 0 #e0a800}
  .inv{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-weight:700; letter-spacing:.3px}
  .badge{display:inline-block; border-radius:6px; padding:2px 8px; font-size:12px; font-weight:600; white-space:nowrap}
  .badge.ok{background:var(--ok-bg); color:var(--ok)} .badge.warn{background:var(--warn-bg); color:var(--warn)}
  .badge.bad{background:var(--bad-bg); color:var(--bad)} .badge.grey{background:var(--grey-bg); color:var(--grey)}
  .line-tag{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2); white-space:nowrap}
  .line-tag i{width:10px;height:10px;border-radius:50%;flex:none}
  /* --- онлайн-режим: вход, сверка, правка --- */
  .authbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
  .authbar .who{color:#cfe0f0}
  .authbar .role{background:#20364c;border-radius:999px;padding:2px 9px;font-size:11.5px;color:#9fd0ff}
  .authbar .btn{background:#1c2632;border-color:#2a3644;color:#dfe8f2}
  .authbar .btn:hover{background:#243141}
  .authbar .btn.primary{background:#2f8f4f;border-color:#2f8f4f;color:#fff}
  .dot-live{width:9px;height:9px;border-radius:50%;background:#2fbf5f;box-shadow:0 0 0 3px rgba(47,191,95,.2);display:inline-block}
  .dot-off{background:#8b97a5;box-shadow:none}
  .rowact{display:flex;gap:5px;flex-wrap:wrap}
  .iconbtn{border:1px solid var(--border);background:#fff;border-radius:7px;padding:3px 7px;font-size:12px;cursor:pointer;white-space:nowrap}
  .iconbtn:hover{background:#f2f7fd;border-color:#a9c4e0}
  .iconbtn.on{background:var(--ok-bg);border-color:#b7e2d2;color:var(--ok)}
  .iconbtn.danger:hover{background:var(--bad-bg);border-color:#f0c4c0;color:var(--bad)}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok);font-weight:600}
  .chk.no{color:var(--grey);font-weight:400}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
  .fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid var(--border);border-radius:9px;font:inherit;outline:none;background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#9fb3c8}
  .fld.full{grid-column:1 / -1}
  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .photo-grid figure{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
  .photo-grid img{width:100%;height:110px;object-fit:cover;display:block;cursor:zoom-in}
  .photo-grid figcaption{font-size:11.5px;color:var(--muted);padding:5px 7px}
  .cmt{border-bottom:1px solid #eef1f5;padding:9px 2px}
  .cmt:last-child{border-bottom:0}
  .cmt .who{font-size:12px;color:var(--muted)}
  .audit{font-size:12.5px}
  .audit td{padding:5px 8px}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tab{border:1px solid var(--border);background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13px}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  /* --- сборки и однолинейные схемы --- */
  .fire{border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:14px;background:#fbfdff}
  .fire.bad{border-color:#f0c4c0;background:#fff9f8}
  .fire.warn{border-color:#f0dcb4;background:#fffdf6}
  .fire.ok{border-color:#bfe3d4;background:#f6fdfa}
  .fire-head{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
  .fire-ico{font-size:16px}
  .compl{display:flex;gap:16px;align-items:center;border:1px solid var(--border);border-radius:14px;
    padding:12px 16px;margin-bottom:14px;background:#fbfdff}
  .compl.ok{border-color:#bfe3d4;background:#f6fdfa}
  .compl.warn{border-color:#f0dcb4;background:#fffdf6}
  .compl.bad{border-color:#f0c4c0;background:#fff9f8}
  .gauge{width:150px;height:93px;flex:none}
  .gauge .g-bg{fill:none;stroke:#e7edf3;stroke-width:10;stroke-linecap:round}
  .gauge .g-fg{fill:none;stroke-width:10;stroke-linecap:round}
  .gauge .g-val{font-size:19px;font-weight:700;fill:var(--ink)}
  .gauge .g-cap{font-size:7.5px;fill:var(--muted)}
  .compl-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:13px}
  .compl-w{color:var(--muted);font-size:11.5px;font-weight:400;margin-left:4px}
  .compl-exp{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--ink-2)}
  .gate,.blocked{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(12,26,42,.55)}
  .gate.open,.blocked.open{display:grid}
  .blocked-card{max-width:540px;background:#fff;border-radius:16px;padding:26px 30px;text-align:center;
    box-shadow:0 18px 50px rgba(10,25,45,.28)}
  .blocked-ico{font-size:32px;margin-bottom:4px}
  .blocked-card h2{margin:0 0 10px;font-size:20px}
  .blocked-card p{margin:6px 0;color:var(--ink-2);font-size:13.5px;line-height:1.5}
  .blocked-card .muted{color:var(--muted);font-size:12.5px}
  .blocked-card .btn{margin-top:14px}
  .wm{position:fixed;right:10px;bottom:8px;z-index:70;font-size:11.5px;color:#5b6b7c;
    background:rgba(255,255,255,.86);border:1px solid var(--border);border-radius:8px;padding:3px 8px;pointer-events:none}
  .wm-big{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;opacity:.07}
  .wm-line{position:absolute;white-space:nowrap;font-size:15px;font-weight:700;color:#0b1f33;transform:rotate(-16deg)}
  .m-head .back{margin-right:4px; font-size:19px; font-weight:600}
  @media (max-width:760px){ .m-head .back{width:44px; height:44px; font-size:22px} }
  .chip-x{border:0;background:none;cursor:pointer;color:#2f6fb0;font-weight:700;margin-left:6px;padding:0}
  .filters{display:flex;gap:5px;flex-wrap:wrap;margin-left:8px}
  .fbtn{border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12.5px;transition:.14s}
  .fbtn:hover{background:#f2f6fb}
  .fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip-filter b{color:var(--accent)}
  .chip.svc{background:#eef4fb;border-color:#cfe0f0;color:#2f6fb0;font-weight:600}
  .asm-block{margin-top:20px;border-top:1px solid var(--border);padding-top:14px}
  .asm-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .asm-head h3{margin:0;font-size:15px}
  .asmcard.asm-bad{border-color:#f0c4c0;background:#fffafa}
  .asmcard.asm-bad .c-name::after{content:' ⚠';color:var(--bad)}
  .dia-list{display:flex;flex-direction:column;gap:10px}
  .dia-row{display:flex;gap:12px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:10px;background:#fff}
  .dia-row.dia-bad{border-color:#eeb5b0;background:#fff8f7}
  .dia-row.dia-warn{border-color:#f0dcb4;background:#fffdf7}
  .dia-thumb{width:96px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:none;background:#f6f8fb;cursor:zoom-in}
  .dia-pdf{display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
  .dia-mid{flex:1;min-width:0}
  .dia-title{font-weight:600}
  .dia-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .dia-right{flex:none;text-align:right}
  .upload-box{margin-top:16px;border:1px dashed #cdd7e2;border-radius:12px;padding:14px;background:#fafcfe}
  .warn{display:none; pointer-events:none}
  .warn circle{fill:#c62828;stroke:#fff;stroke-width:1.5}
  .warn text{fill:#fff;font-weight:800}
  .empty{border:1px dashed #cdd7e2; border-radius:12px; padding:18px; text-align:center; color:var(--muted); background:#fafcfe}
  .empty b{color:var(--ink-2)}
  .note{font-size:12.5px; color:var(--muted); margin-top:12px}
  @media (max-width:640px){
    .overlay{padding:0} .modal{max-height:100vh; height:100%; border-radius:0}
    .map-toolbar{max-width:calc(100% - 24px)}
  }
  @media print{
    .topbar,.stats,.map-area,footer,.m-foot,.x,#mSteps{display:none !important}
    body{background:#fff}
    .overlay{position:static; display:block; padding:0; background:#fff}
    .modal{box-shadow:none; max-height:none; width:100%; border-radius:0}
    .m-body{overflow:visible}
    table.tbl th{position:static}
  }

  /* ---------------------------- телефоны ---------------------------------- */
  @media (max-width: 760px){
    .brand small{display:none}
    .brand h1{font-size:15px; line-height:1.2}
    .search-wrap{order:9; flex:1 1 100%; max-width:none; margin-top:6px}
    .stats{gap:8px; padding:6px 10px; overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch}
    .stats::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}
    .stat{white-space:nowrap; font-size:12.5px}
    .stat b{font-size:14px}
    .filters{flex-wrap:nowrap; overflow-x:auto; margin-left:0; padding-bottom:2px}
    .line-chip{white-space:nowrap; font-size:12.5px; padding:4px 9px}
    .fbtn{white-space:nowrap; padding:5px 10px}
    main{min-height:58vh}
    .map-area{min-height:58vh}
    .grid{grid-template-columns:1fr}
    .card{padding:12px}
    #modal,.modal{width:100vw!important; max-width:none!important; height:100vh; max-height:100vh;
      border-radius:0; margin:0; top:0; left:0; right:0; bottom:0}
    #mBody,.m-body{max-height:none; flex:1 1 auto; overflow:auto}
    .m-head{padding:14px 16px 10px}
    .m-foot{padding:10px 12px; flex-wrap:wrap; gap:8px}
    .btn,.iconbtn{min-height:38px}
    table.tbl{font-size:11.5px}
    table.tbl th,table.tbl td{padding:6px 7px}
    .form-grid{grid-template-columns:1fr}
    .compl{flex-direction:column; align-items:stretch}
    .gauge{margin:0 auto}
  }

  /* шапка окна не залезает под статус-бар и вырез экрана */
  .m-head{padding-top:calc(16px + env(safe-area-inset-top, 0px));
          padding-left:calc(18px + env(safe-area-inset-left, 0px));
          padding-right:calc(18px + env(safe-area-inset-right, 0px));
          flex-wrap:wrap; gap:8px}
  .backbtn{margin-bottom:6px}
  @media (max-width:760px){
    .m-head{padding-top:calc(20px + env(safe-area-inset-top, 0px)); padding-bottom:12px}
    .backbtn{padding:9px 14px!important; font-size:15px!important; margin-bottom:8px}
    .modal{height:100dvh; max-height:100dvh}
    .m-foot{padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px))}
  }

  /* сворачиваемые панели: карта остаётся чистой */
  body.clean .topbar, body.clean .stats { display:none }
  #panelToggle{position:fixed;top:8px;right:8px;z-index:45;display:inline-flex;align-items:center;gap:6px;
    padding:8px 13px;border-radius:12px;border:1px solid #cdd7e2;background:rgba(255,255,255,.95);
    font:600 13px/1 inherit;color:#20303f;cursor:pointer;box-shadow:0 4px 14px rgba(10,25,45,.16)}
  @media (max-width:760px){
    #panelToggle{top:calc(8px + env(safe-area-inset-top, 0px));right:8px;padding:11px 15px;font-size:14px}
    body.clean .map-toolbar{top:calc(8px + env(safe-area-inset-top, 0px));left:8px}
  }

  /* режим списка станций вместо схемы */
  body.listmode .map-area{display:none}
  #listView{display:none;padding:12px 14px calc(90px + env(safe-area-inset-bottom, 0px));max-width:1100px;margin:0 auto}
  body.listmode #listView{display:block}
  .lv-line{border:1px solid var(--border);border-radius:14px;margin-bottom:12px;background:#fff;overflow:hidden}
  .lv-head{display:flex;align-items:center;gap:9px;padding:12px 14px;font-weight:700;font-size:15px;background:#f7fafd}
  .lv-head i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .lv-head b{margin-left:auto;color:var(--muted);font-weight:600;font-size:13px}
  .lv-st{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border:0;
    border-top:1px solid #eef2f7;background:#fff;font-size:14.5px;cursor:pointer;color:inherit}
  .lv-st:hover{background:#f5f9fd}
  .lv-st .nm{flex:1}
  .lv-st .ct{color:var(--muted);font-size:12.5px;white-space:nowrap}
  @media (max-width:760px){ .lv-st{padding:14px} .lv-head{padding:13px 14px} }

  /* плавающая кнопка «Карта/Список» — видна всегда */
  #viewToggle{display:none;position:fixed;left:8px;top:calc(8px + env(safe-area-inset-top, 0px));z-index:46;
    padding:11px 16px;border-radius:12px;border:1px solid #cdd7e2;background:rgba(255,255,255,.96);
    font:700 14px/1 inherit;color:#20303f;cursor:pointer;box-shadow:0 4px 14px rgba(10,25,45,.18)}
  body.listmode #viewToggle{display:inline-flex;align-items:center;gap:6px}
  #viewToggleFloat{position:fixed;right:10px;bottom:calc(70px + env(safe-area-inset-bottom, 0px));z-index:47;
    padding:13px 18px;border-radius:14px;border:1px solid #cdd7e2;background:#fff;
    font:700 15px/1 inherit;color:#20303f;cursor:pointer;box-shadow:0 8px 22px rgba(10,25,45,.22);display:none}
  body.listmode #viewToggleFloat{display:inline-block}
  body.listmode #listView{padding-top:12px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo" id="logo">М</div>
    <div>
      <h1 id="pageTitle">Интерактивная карта Московского метрополитена</h1>
      <p id="pageSub">Оборудование систем кондиционирования: линия → станция → вестибюль → помещение → система</p>
    </div>
  </div>
  <div class="authbar" id="authbar"></div>
  <div class="search-wrap">
    <span class="search-ico">⌕</span>
    <input id="search" type="search" autocomplete="off" placeholder="Поиск: станция, линия, № помещения, инвентарный номер…">
    <div id="searchResults"></div>
  </div>
</header>

<div class="stats" id="stats"></div>

<main>
  <div class="map-area" id="mapArea">
    <div class="map-toolbar">
      <button class="zbtn" id="zoomIn" title="Приблизить">+</button>
      <button class="zbtn" id="zoomOut" title="Отдалить">−</button>
      <button class="zbtn" id="zoomFit" title="Вся сеть">⤢ Вся сеть</button>
      <button class="zbtn" id="labelMode" title="Подписи станций">Подписи: авто</button>
      <span class="hint">клик по станции · колесо или два пальца — зум · перетаскивание — сдвиг</span>
    </div>
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <g id="viewport">
        <g id="lines"></g>
        <g id="depotsG"></g>
        <g id="stationsG"></g>
        <g id="labelsG"></g>
      </g>
    </svg>
    <div id="tooltip"></div>
  </div>
</main>

<footer>
  <span style="flex:1"></span>
  <span id="sourceNote"></span>
  <span id="verTag" style="margin-left:10px;opacity:.55">версия 31 — кнопка возврата на виду</span>
</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="m-head"><button onclick="goBack()" class="backbtn" style="position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom, 0px));z-index:66;padding:13px 20px;border-radius:14px;border:1px solid #cdd7e2;background:#fff;font-size:16px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 8px 22px rgba(10,25,45,.22)">← Назад</button>
      <div class="m-top">
        <div class="m-title">
          <div class="crumb" id="crumb"></div>
          <h2 id="mTitle">—</h2>
          <div class="sub" id="mSub"></div>
        </div>
        <button class="x" id="mClose" title="Закрыть (Esc)">✕</button>
      </div>
      <div class="steps" id="mSteps"></div>
    </div>
    <div class="m-body" id="mBody"></div>
    <div class="m-foot" id="mFoot"></div>
  </div>
</div>

<div class="overlay" id="editOverlay" role="dialog" aria-modal="true">
  <div class="modal" style="width:min(900px,100%)">
    <div class="m-head"><button onclick="goBack()" class="backbtn" style="margin:0 12px 0 0;padding:7px 13px;border-radius:9px;border:1px solid #cdd7e2;background:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;align-self:flex-start;order:-1">← Назад</button>
      <div class="m-top">
        <div class="m-title">
          <div class="crumb" id="eCrumb"></div>
          <h2 id="eTitle">—</h2>
          <div class="sub" id="eSub"></div>
        </div>
        <button class="x" id="eClose" title="Закрыть (Esc)">✕</button>
      </div>
    </div>
    <div class="m-body" id="eBody"></div>
    <div class="m-foot" id="eFoot"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================================
   Данные — в JSON выше (или в metro-data.json рядом с этим файлом).

   Схема:
   { meta:{...},
     lines:[{ id, name, color, ring, stationCount, termini }],
     stations:[{ id, lineId, number, code, name, lat, lon, transfer, opened,
        groups:[{ id, name, roomCount, systemCount,
           rooms:[{ number, purpose, area, systems:[
              { type, typeTitle, model, inv, serial, power, refrigerant,
                installed, status, lastService, nextService, serviceOrg, note }]}]}]}]}

   Состав линий, станции и координаты — фактические (ru.wikipedia, CC BY-SA 4.0).
   Помещения, системы кондиционирования и инвентарные номера — демонстрационные.
   ========================================================================== */

const DATA = JSON.parse(document.getElementById('metro-data').textContent);
const LINES = DATA.lines;
const STATIONS = DATA.stations;
const LINE_BY_ID = Object.fromEntries(LINES.map(l => [l.id, l]));
const lineOf = (st) => LINE_BY_ID[st.lineId] || {name:'—', color:'#888'};
const lineColor = (st) => lineOf(st).color;

document.getElementById('pageTitle').textContent = DATA.meta.title;
document.getElementById('pageSub').textContent = DATA.meta.subtitle;
document.getElementById('sourceNote').textContent = DATA.meta.sourceNote || '';

/* ------------------------------- утилиты --------------------------------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const plural = (n, one, few, many) => {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
};
/* состояние оборудования: «исправен» / «неисправен» / прочее */
const stateClass = (s) => {
  const t = String(s || '').toLowerCase();
  if (t.includes('неисправ') || t.includes('не исправ') || t.includes('ошибк')) return 'bad';
  if (t.includes('исправ') || t.includes('работ')) return 'ok';
  if (!t || t === 'нет данных') return 'grey';
  return 'warn';
};
const shortState = (s) => {
  const t = String(s || '').trim();
  if (!t) return 'нет данных';
  const low = t.toLowerCase();
  if (low.includes('неисправ') || low.includes('не исправ')) return 'неисправен';
  if (low.includes('исправ')) return 'исправен';
  return t.length > 40 ? t.slice(0, 38) + '…' : t;
};
const roomSystems = (r) => r.systems || [];
const roomLabel = (r) => (r.number && r.number !== '—' && r.number !== '?')
  ? r.number : (r.place || 'б/н');
/* кнопки действий в строке оборудования (появляются в онлайн-режиме) */
function rowActions(x){
  if (!x.id) return '<span class="note">—</span>';
  const cm = commentsOf(x.id).length, ph = photosOf(x.id).length;
  return '<span class="rowact">'
    + `<button class="iconbtn" data-card="${escAttr(x.id)}">${cm || ph ? '💬 ' + cm + ' · 📷 ' + ph : 'Открыть'}</button>`
    + (canVerify() && !x.verifiedAt ? `<button class="iconbtn" data-verify="${escAttr(x.id)}">✓ Проверено</button>` : '')
    + (canEdit() ? `<button class="iconbtn" data-edit="${escAttr(x.id)}">Изменить</button>` : '')
    + '</span>';
}
/* на схеме — только станции; депо/АБК (offMap) живут в поиске и реестре */
const MAP_STATIONS = STATIONS.filter(s => !s.offMap && s.sx != null && s.sy != null);
/* депо, АБК, ОЗЭП — рисуются сноской рядом со «своей» станцией */
const DEPOTS = STATIONS.filter(s => s.offMap && s.sx != null && s.sy != null);
const STATION_BY_ID = Object.fromEntries(STATIONS.map(s => [s.id, s]));
const stationsOfLine = (id) => MAP_STATIONS.filter(s => s.lineId === id).sort((a,b) => a.number - b.number);

/* --------------------------- сводная статистика --------------------------- */

let focusLineId = null;      // выбранная линия (объявляем до renderStats)

/* =========================================================================
   ФИЛЬТРЫ: линия + категория (схемы, техпомещения, неисправности, просрочка)
   ========================================================================= */
let filterMode = 'all';
const FILTERS = [
  { id: 'all',        label: 'Всё' },
  { id: 'diagrams',   label: 'Однолинейные схемы' },
  { id: 'outdoor',    label: 'Технические помещения' },
  { id: 'faults',     label: 'Неисправности' },
  { id: 'overdue',    label: 'Просроченные схемы' },
  { id: 'unverified', label: 'Не проверено' },
  { id: 'fire',       label: 'Пожаротушение' }
];
const FILTER_HINT = {
  all: 'Показаны все станции',
  diagrams: 'Станции, у которых заведены сборки и однолинейные схемы',
  outdoor: 'Станции с техническими помещениями для наружных блоков',
  faults: 'Станции с неисправным оборудованием',
  overdue: 'Станции, где есть схемы старше 2 г 10 мес',
  unverified: 'Станции с непроверенным оборудованием',
  fire: 'Сборки с неукомплектованным или просроченным пожаротушением'
};
function stationFaults(st){
  return st.groups.reduce((n, g) => n + g.rooms.reduce((m, r) =>
    m + (r.systems || []).filter(x => stateClass(x.state) === 'bad').length, 0), 0);
}
function stationUnverified(st){
  return st.groups.reduce((n, g) => n + g.rooms.reduce((m, r) =>
    m + (r.systems || []).filter(x => x.id && !x.verifiedAt).length, 0), 0);
}
function stationOutdoor(st){
  return st.groups.some(g => g.name === OUTDOOR_GROUP && g.rooms.length);
}
function stationDiagrams(st){
  return window.ONLINE && ONLINE.ready && ONLINE.diagrams.some(d => d.station_id === st.id && !d.deleted_at);
}
function stationOverdue(st){
  return window.ONLINE && ONLINE.ready &&
    ONLINE.diagrams.some(d => d.station_id === st.id && !d.deleted_at &&
      monthsBetween(d.diagram_date) >= SCHEMA_MAX_MONTHS);
}
function stationFire(st){
  const list = ONLINE.ready
    ? ONLINE.assemblies.filter(a => a.station_id === st.id)
    : (st.assemblies || []);
  return list.filter(a => {
    const f = fireStatusOf(a);
    return f.code !== 'none' && (f.code === 'bad' || f.code === 'nodate' || a.fire_complete !== true);
  }).length;
}
function stationMatches(st){
  switch (filterMode){
    case 'diagrams':   return stationDiagrams(st);
    case 'outdoor':    return stationOutdoor(st);
    case 'faults':     return stationFaults(st) > 0;
    case 'overdue':    return stationOverdue(st);
    case 'unverified': return stationUnverified(st) > 0;
    case 'fire':       return stationFire(st) > 0;
    default:           return true;
  }
}
function isStationVisible(st){
  return (!focusLineId || st.lineId === focusLineId) && stationMatches(st);
}
/* подпись счётчика для текущего фильтра */
function filterCount(){
  const scoped = focusLineId ? MAP_STATIONS.filter(s => s.lineId === focusLineId) : MAP_STATIONS;
  switch (filterMode){
    case 'diagrams':   return scoped.filter(stationDiagrams).length + ' станций со схемами';
    case 'outdoor':    return scoped.filter(stationOutdoor).length + ' станций с техпомещениями';
    case 'faults':     return scoped.reduce((n, s) => n + stationFaults(s), 0) + ' неисправных единиц';
    case 'overdue':    return scoped.filter(stationOverdue).length + ' станций с просрочкой';
    case 'unverified': return scoped.reduce((n, s) => n + stationUnverified(s), 0) + ' непроверенных единиц';
    case 'fire':       return scoped.reduce((n, s) => n + stationFire(s), 0) + ' сборок с замечаниями по пожаротушению';
    default:           return '';
  }
}

/* что сейчас отфильтровано — с учётом и линии, и категории */
function filterSummary(){
  const cat = (FILTERS.find(f => f.id === filterMode) || FILTERS[0]).label;
  const parts = [];
  if (focusLineId){
    const l = LINES.find(x => x.id === focusLineId);
    if (l) parts.push('линия: ' + l.name);
  }
  if (cat !== 'Всё') parts.push(cat.toLowerCase() + ' — ' + filterCount());
  return parts.length ? '<b>' + parts.join(' · ') + '</b>' : '<span>фильтр не задан</span>';
}
let TOTALS = {rooms:0, systems:0, bad:0};
function renderStats(){
  const scoped = focusLineId
    ? STATIONS.filter(s => s.lineId === focusLineId)
    : STATIONS;
  const mapScoped = scoped.filter(s => !s.offMap);
  let rooms = 0, sys = 0, bad = 0, verified = 0, unitsInFilter = 0;
  scoped.forEach(s => s.groups.forEach(g => g.rooms.forEach(r => {
    rooms++;
    roomSystems(r).forEach(x => {
      sys++;
      if (stateClass(x.state) === 'bad') bad++;
      if (x.verifiedAt) verified++;
    });
  })));
  const line = focusLineId ? LINE_BY_ID[focusLineId] : null;
  const offMap = scoped.filter(s => s.offMap).length;
  TOTALS = {rooms, systems: sys, bad};

  $('stats').innerHTML = `
    ${line ? `<span class="chip" style="background:#eaf2fa;border-color:#bcd6ee;color:#2f6fb0;font-weight:600">
        Линия: ${esc(line.name)}
        <button class="chip-x" id="resetLine" title="Показать все линии">✕</button></span>` : ''}
    <span class="stat"><b>${mapScoped.filter(s => s.groups.length).length}</b> <span>станций с данными</span></span>
    <span class="stat"><b>${rooms}</b> <span>${plural(rooms,'помещение','помещения','помещений')}</span></span>
    <span class="stat"><b>${sys}</b> <span>${plural(sys,'единица','единицы','единиц')} оборудования</span></span>
    <span class="stat"><b style="color:${bad ? 'var(--bad)' : 'inherit'}">${bad}</b> <span>неисправных</span></span>
    ${(window.ONLINE && ONLINE.ready) ? `
      <span class="stat"><b>${verified}</b> <span>проверено</span></span>
      <span class="stat"><b style="color:${scoped.reduce((n,s) => n + ONLINE.diagrams.filter(d => d.station_id === s.id && monthsBetween(d.diagram_date) >= SCHEMA_MAX_MONTHS).length, 0) ? 'var(--bad)' : 'inherit'}">
        ${scoped.reduce((n,s) => n + ONLINE.diagrams.filter(d => d.station_id === s.id && monthsBetween(d.diagram_date) >= SCHEMA_MAX_MONTHS).length, 0)}</b>
        <span>схем старше ${SCHEMA_MAX_LABEL}</span></span>` : ''}
    ${offMap ? `<span class="stat"><b>${offMap}</b> <span>депо и объектов</span></span>` : ''}
    <span class="stat chip-filter">${filterSummary()}</span>
    <span class="spacer"></span>
    ${LINES.map(l => `<button class="line-chip ${focusLineId === l.id ? 'on' : ''}" data-line="${esc(l.id)}" title="${esc(l.termini||'')}">
        <i style="background:${esc(l.color)}"></i>${esc(l.name)}<b>${l.stationCount}</b></button>`).join('')}
    <div class="filters">
      ${FILTERS.map(f => `<button class="fbtn ${filterMode === f.id ? 'on' : ''}" data-filter="${f.id}"
        title="${escAttr(FILTER_HINT[f.id])}">${esc(f.label)}</button>`).join('')}
    </div>
    <button class="btn" id="openRegistry">Реестр оборудования</button>
    <button class="btn" id="exportAll">Экспорт CSV</button>`;

  $('openRegistry').onclick = () => openRegistry();
  $('exportAll').onclick = () => exportCsv(allRows().filter(rowMatchesFilter), 'oborudovanie-sk-metro.csv');
  const rl = $('resetLine');
  if (rl) rl.onclick = () => { setFocus(null); fitAll(); renderStats(); };
  document.querySelectorAll('.line-chip').forEach(chip => {
    chip.onclick = () => { toggleFocus(chip.dataset.line); renderStats(); };
  });
  document.querySelectorAll('.fbtn').forEach(b => {
    b.onclick = () => { filterMode = filterMode === b.dataset.filter ? 'all' : b.dataset.filter; renderStats(); updateScale(); renderWarnBadges(); };
  });
}
renderStats();
/* строка реестра проходит фильтр категории */
function rowMatchesFilter(r){
  switch (filterMode){
    case 'outdoor':    return r.group === OUTDOOR_GROUP || isOutdoorPlace(r.place, r.room);
    case 'faults':     return stateClass(r.state) === 'bad';
    case 'unverified': return !r.verifiedAt;
    case 'diagrams':
    case 'overdue':    return false;
    default:           return true;
  }
}

/* ------------------- схематическая система координат ---------------------- */
/* Координаты sx/sy приходят из раскладки (_src/layout_scheme.py):
   кольца — правильные окружности, радиусы — прямые линии. География не используется. */
const PROJ = (() => {
  const pts = MAP_STATIONS.concat(DEPOTS);
  const xs = pts.map(s => s.sx), ys = pts.map(s => s.sy);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = 165;      // запас под плашки-сноски (они рисуются постоянного размера)
  return { W: (x1 - x0) + pad*2, H: (y1 - y0) + pad*2, ox: x0 - pad, oy: y0 - pad };
})();
const RING_CX = -PROJ.ox, RING_CY = -PROJ.oy;   // центр колец в координатах холста
MAP_STATIONS.concat(DEPOTS).forEach(s => { s.px = s.sx - PROJ.ox; s.py = s.sy - PROJ.oy; });

const svg = $('map'), viewport = $('viewport');
const gLines = $('lines'), gStations = $('stationsG'), gLabels = $('labelsG'), gDepots = $('depotsG');
const svgEl = (tag, attrs) => {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (attrs||{})) n.setAttribute(k, attrs[k]);
  return n;
};

svg.setAttribute('viewBox', `0 0 ${PROJ.W} ${PROJ.H}`);

/* линии: кольцо — окружность, радиус — прямая */
const lineNodes = new Map();
LINES.forEach(line => {
  const pts = stationsOfLine(line.id).map(s => ({x:s.px, y:s.py}));
  if (!pts.length) return;
  let el;
  if (line.ring){
    const r = pts.reduce((a,p) => a + Math.hypot(p.x - RING_CX, p.y - RING_CY), 0) / pts.length;
    el = svgEl('circle', {
      class:'line-path', cx: RING_CX, cy: RING_CY, r,
      stroke: line.color, 'stroke-width': 6, 'data-line': line.id
    });
  } else {
    el = svgEl('path', {
      class:'line-path', d: 'M ' + pts.map(p => `${p.x} ${p.y}`).join(' L '),
      stroke: line.color, 'stroke-width': 6, 'data-line': line.id
    });
  }
  gLines.appendChild(el);
  lineNodes.set(line.id, {path: el, line});
});

/* перемычки пересадок: пара станций разных линий, которые ссылаются друг на друга
   в поле «пересадки» и стоят рядом на схеме. Просто «ближайшая станция другой линии»
   не годится — рядом с узлом оказываются соседние станции той же линии. */
const TWINS = (() => {
  const linked = (st, lineName) => (st.transfer || '').split(',')
    .map(x => x.trim())
    .some(x => x === lineName || (x && (lineName.startsWith(x) || x.startsWith(lineName))));
  const cands = [];
  MAP_STATIONS.forEach(a => {
    if (!a.transfer) return;
    MAP_STATIONS.forEach(b => {
      if (b.lineId === a.lineId || !b.transfer) return;
      if (!linked(a, lineOf(b).name) || !linked(b, lineOf(a).name)) return;
      const d = Math.hypot(a.sx - b.sx, a.sy - b.sy);
      if (d <= 80) cands.push({a, b, d});
    });
  });
  cands.sort((p, q) => p.d - q.d);
  const used = new Set(), pairs = [];
  cands.forEach(({a, b}) => {
    if (used.has(a.id) || used.has(b.id)) return;
    used.add(a.id); used.add(b.id);
    pairs.push([a, b]);
  });
  return pairs;
})();
const gConn = svgEl('g', {class:'connections'});
gLines.appendChild(gConn);
const connNodes = TWINS.map(([a, b]) => {
  const els = [];
  for (const [cls, w, color] of [['conn-out', 10, '#cfd8e3'], ['conn-in', 6.5, '#ffffff']]){
    const ln = svgEl('line', {
      class: cls, x1: a.px, y1: a.py, x2: b.px, y2: b.py,
      stroke: color, 'stroke-width': w, 'stroke-linecap': 'round'
    });
    gConn.appendChild(ln);
    els.push(ln);
  }
  return {a, b, els};
});

/* сноски: депо, АБК, ОЗП рядом со своей станцией */
const depotNodes = new Map();
DEPOTS.forEach(d => {
  const parent = STATION_BY_ID[d.parentId];
  if (parent && parent.px != null){
    gDepots.appendChild(svgEl('line', {
      class:'depot-link', x1: parent.px, y1: parent.py, x2: d.px, y2: d.py
    }));
  }
  const g = svgEl('g', {
    class:'station depot', 'data-id': d.id, tabindex:'0', role:'button',
    transform: `translate(${d.px} ${d.py})`,
    'aria-label': `${d.name}, объект рядом со станцией ${parent ? parent.name : ''}`
  });
  const rect = svgEl('rect', {class:'depot-chip', rx:4, ry:4});
  const txt = svgEl('text', {class:'depot-text', 'text-anchor':'middle'});
  txt.textContent = d.shortName || d.name;
  g.appendChild(rect);
  g.appendChild(txt);
  gDepots.appendChild(g);
  depotNodes.set(d.id, {g, rect, txt, st: d});
});

/* станции */
const stationNodes = new Map();
MAP_STATIONS.forEach(st => {
  const g = svgEl('g', {
    class:'station', 'data-id': st.id, tabindex:'0', role:'button',
    transform: `translate(${st.px} ${st.py})`,
    'aria-label': `${st.name}, ${lineOf(st).name}`
  });
  g.appendChild(svgEl('circle', {class:'hit'}));
  const body = svgEl('circle', {class:'body', stroke: lineColor(st)});
  g.appendChild(body);
  g.dataset.line = st.lineId;
  gStations.appendChild(g);
  stationNodes.set(st.id, {g, body, st});
});

/* --------------------------- зум, панорама, вид --------------------------- */
let k = 1, tx = 0, ty = 0;
let labelMode = 'auto';                 // auto | all | none
let lastRect = {width: 1000, height: 800};

function applyView(){ viewport.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`); }
function svgRect(){ const r = svg.getBoundingClientRect(); return {width: r.width||1000, height: r.height||800}; }
function baseScale(){ const r = lastRect; return Math.min(r.width / PROJ.W, r.height / PROJ.H); }

function fitToBox(x0, y0, x1, y1){
  lastRect = svgRect();
  const s0 = baseScale();
  const bw = Math.max(1e-6, x1 - x0), bh = Math.max(1e-6, y1 - y0);
  k = Math.min(lastRect.width / (bw * s0), lastRect.height / (bh * s0)) * 0.96;
  k = Math.max(0.2, Math.min(40, k));
  tx = PROJ.W/2 - ((x0 + x1)/2) * k;
  ty = PROJ.H/2 - ((y0 + y1)/2) * k;
  applyView();
  updateScale();
}
function fitAll(){ fitToBox(0, 0, PROJ.W, PROJ.H); }
function fitLine(id){
  const pts = stationsOfLine(id).map(s => ({x:s.px, y:s.py}));
  if (!pts.length) return;
  const pad = 60;
  fitToBox(Math.min(...pts.map(p=>p.x)) - pad, Math.min(...pts.map(p=>p.y)) - pad,
           Math.max(...pts.map(p=>p.x)) + pad, Math.max(...pts.map(p=>p.y)) + pad);
}

function zoomAt(px, py, factor){
  const nk = Math.max(0.25, Math.min(60, k * factor));
  const r = nk / k;
  tx = px - (px - tx) * r;
  ty = py - (py - ty) * r;
  k = nk;
  applyView();
  updateScale();
}
function svgPoint(evt){
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const p = svgPoint(e);
  zoomAt(p.x, p.y, e.deltaY < 0 ? 1.18 : 1/1.18);
}, {passive:false});
$('zoomIn').onclick = () => zoomAt(PROJ.W/2, PROJ.H/2, 1.3);
$('zoomOut').onclick = () => zoomAt(PROJ.W/2, PROJ.H/2, 1/1.3);
$('zoomFit').onclick = () => { setFocus(null); fitAll(); };
if ($('mBack')) $('mBack').onclick = goBack;
$('labelMode').onclick = () => {
  labelMode = labelMode === 'auto' ? 'all' : labelMode === 'all' ? 'none' : 'auto';
  $('labelMode').textContent = 'Подписи: ' + (labelMode === 'auto' ? 'авто' : labelMode === 'all' ? 'все' : 'скрыть');
  renderLabels();
};

let drag = null, moved = 0, rafPending = false;
const activePointers = new Map();     // активные касания/мышь
let pinch = null;                     // состояние жеста «щипок»
let scaleRaf = false;

function clientToVB(cx, cy){
  const pt = svg.createSVGPoint();
  pt.x = cx; pt.y = cy;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function scheduleScale(){
  if (scaleRaf) return;
  scaleRaf = true;
  requestAnimationFrame(() => { scaleRaf = false; updateScale(); });
}
function pinchState(){
  const [a, b] = [...activePointers.values()];
  const mid = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
  const vb = clientToVB(mid.x, mid.y);
  return {
    d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
    k, tx, ty,
    cx: (vb.x - tx) / k, cy: (vb.y - ty) / k      // точка схемы под серединой жеста
  };
}

svg.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  activePointers.set(e.pointerId, {x: e.clientX, y: e.clientY});
  try { svg.setPointerCapture(e.pointerId); } catch(_){}
  if (activePointers.size === 1){
    drag = {x:e.clientX, y:e.clientY, tx, ty};
    moved = 0;
    svg.classList.add('dragging');
  } else if (activePointers.size === 2){
    drag = null;                 // это жест, а не перетаскивание
    moved = 99;                  // и не клик по станции
    pinch = pinchState();
  }
});
svg.addEventListener('pointermove', (e) => {
  if (!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x: e.clientX, y: e.clientY});

  if (activePointers.size >= 2 && pinch){
    const [a, b] = [...activePointers.values()];
    const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
    const nk = Math.max(0.25, Math.min(60, pinch.k * (d / pinch.d)));
    const mid = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
    const vb = clientToVB(mid.x, mid.y);
    k = nk;
    tx = vb.x - pinch.cx * nk;
    ty = vb.y - pinch.cy * nk;
    applyView();
    scheduleScale();
    return;
  }
  if (!drag) return;
  const r = lastRect;
  const sx = PROJ.W / r.width, sy = PROJ.H / r.height;
  moved = Math.max(moved, Math.hypot(e.clientX - drag.x, e.clientY - drag.y));
  tx = drag.tx + (e.clientX - drag.x) * sx;
  ty = drag.ty + (e.clientY - drag.y) * sy;
  applyView();
});
function endDrag(e){
  if (e && e.pointerId != null) activePointers.delete(e.pointerId);
  if (e && svg.hasPointerCapture && svg.hasPointerCapture(e.pointerId)){
    try { svg.releasePointerCapture(e.pointerId); } catch(_){}
  }
  if (activePointers.size >= 2){ pinch = pinchState(); return; }
  pinch = null;
  if (activePointers.size === 1 && drag === null){
    // остался один палец — продолжаем как перетаскивание
    const p = [...activePointers.values()][0];
    drag = {x: p.x, y: p.y, tx, ty};
    return;
  }
  drag = null;
  svg.classList.remove('dragging');
  if (activePointers.size === 0) updateScale();
}
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('pointerup', (e) => {
  const wasDrag = moved > 6;
  endDrag(e);
  if (wasDrag) return;
  const st = nearestStation(e.clientX, e.clientY);
  if (st) gotoStation(st);
});
/* На мелком масштабе круги захвата соседних станций перекрываются, поэтому берём
   не «верхнюю» станцию под курсором, а ближайшую к точке клика. */
function nearestStation(cx, cy){
  let best = null, bestD = Infinity;
  const consider = (g, el, st) => {
    if (g.classList.contains('dim')) return;
    const r = el.getBoundingClientRect();
    const d = Math.hypot(cx - (r.left + r.width/2), cy - (r.top + r.height/2));
    const radius = Math.max(12, r.width / 2 + 7);
    if (d <= radius && d < bestD){ bestD = d; best = st; }
  };
  stationNodes.forEach(({g, body, st}) => consider(g, body, st));
  depotNodes.forEach(({g, rect, st}) => consider(g, rect, st));
  return best;
}
svg.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const g = e.target.closest && e.target.closest('.station');
  if (!g) return;
  const rec = stationNodes.get(g.dataset.id);
  if (rec){ e.preventDefault(); gotoStation(rec.st); }
});

/* ------------------- размеры, зависящие от масштаба ----------------------- */
function updateScale(){
  lastRect = svgRect();
  const s = baseScale() * k;             // экранных px на единицу viewBox
  const u = 1 / s;                       // единиц viewBox на экранный px
  stationNodes.forEach(({g, body, st}) => {
    const isFocus = isStationVisible(st);
    const inter = !!st.transfer;
    body.setAttribute('r', (inter ? 8.2 : 5.2) * u);
    body.setAttribute('stroke-width', (inter ? 3.2 : 2.8) * u);
    g.querySelector('.hit').setAttribute('r', 15 * u);
    g.classList.toggle('dim', !isFocus);
  });
  lineNodes.forEach(({path}, id) => {
    path.setAttribute('stroke-width', 7.5 * u);
    path.classList.toggle('dim', !!focusLineId && id !== focusLineId);
  });
  warnNodes.forEach(({ c, t }) => {
    c.setAttribute('r', 7 * u);
    c.setAttribute('stroke-width', 1.5 * u);
    c.setAttribute('cx', 11 * u);
    c.setAttribute('cy', -11 * u);
    t.setAttribute('x', 11 * u);
    t.setAttribute('y', -7.2 * u);
    t.setAttribute('font-size', 10 * u);
  });
  depotNodes.forEach(({g, rect, txt, st}) => {
    const label = st.shortName || st.name;
    const w = (6.7 * label.length + 22) * u, h = 17 * u;
    rect.setAttribute('x', -w / 2);
    rect.setAttribute('y', -h / 2);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('rx', 4 * u);
    rect.setAttribute('ry', 4 * u);
    rect.setAttribute('stroke-width', 1.2 * u);
    txt.setAttribute('font-size', 11 * u);
    txt.setAttribute('y', 4 * u);
    g.classList.toggle('dim', !isStationVisible(st));
  });
  gDepots.querySelectorAll('.depot-link').forEach(el => {
    el.setAttribute('stroke-width', 1.2 * u);
    el.setAttribute('stroke-dasharray', `${3.5 * u} ${3.5 * u}`);
  });
  connNodes.forEach(({a, b, els}) => {
    const on = !focusLineId || a.lineId === focusLineId || b.lineId === focusLineId;
    els[0].setAttribute('stroke-width', 10 * u);
    els[1].setAttribute('stroke-width', 6.5 * u);
    els.forEach(el => el.classList.toggle('dim', !on));
  });
  renderLabels();
}

/* --------------------------- подписи станций ------------------------------ */
/* Подписи держим постоянного размера на экране и раскладываем без наложений:
   сначала пересадочные узлы, затем конечные станции, затем остальные. */
const TERMINI = new Set();
LINES.forEach(l => {
  const s = stationsOfLine(l.id);
  if (s.length){
    TERMINI.add(s[0].id);
    TERMINI.add(s[s.length - 1].id);
  }
});

function renderLabels(){
  gLabels.innerHTML = '';
  if (labelMode === 'none') return;

  const s = baseScale() * k;             // экранных px на единицу viewBox
  const u = 1 / s;                       // единиц viewBox на экранный px
  const fs = 12 * u;                     // кегль: ровно 12 px на экране
  const lh = 13, cw = 6.6;               // высота строки и средняя ширина символа, px

  const ctm = viewport.getScreenCTM();
  const svgBox = svg.getBoundingClientRect();
  const toScreen = (x, y) => ({
    x: ctm.a*x + ctm.c*y + ctm.e - svgBox.left,
    y: ctm.b*x + ctm.d*y + ctm.f - svgBox.top
  });

  const zoomed = k >= 1.8;
  const showAll = labelMode === 'all' || !!focusLineId;
  const items = MAP_STATIONS
    .filter(st => isStationVisible(st))
    .filter(st => showAll || st.transfer || TERMINI.has(st.id) || zoomed)
    .map(st => ({st, prio: (st.transfer ? 4 : 0) + (TERMINI.has(st.id) ? 2 : 0)}))
    .sort((a, b) => b.prio - a.prio);

  const placed = [];
  depotNodes.forEach(({rect}) => {
    const b = rect.getBoundingClientRect();
    placed.push({x: b.left - svgBox.left - 2, y: b.top - svgBox.top - 2, w: b.width + 4, h: b.height + 4});
  });
  const overlaps = (r) => placed.some(p =>
    !(r.x + r.w < p.x || p.x + p.w < r.x || r.y + r.h < p.y || p.y + p.h < r.y));

  /* кружки станций, которые подпись не должна накрывать (кроме своей собственной) */
  const dotBoxes = MAP_STATIONS.map(st => {
    const c = toScreen(st.px, st.py);
    const rad = (st.transfer ? 8.2 : 5.2) + 3;                 // кружок + зазор, screen px
    return {id: st.id, x: c.x - rad, y: c.y - rad, w: rad * 2, h: rad * 2};
  });
  const hitsDot = (r, ownId) => dotBoxes.some(d =>
    d.id !== ownId && !(r.x + r.w < d.x || d.x + d.w < r.x || r.y + r.h < d.y || d.y + d.h < r.y));

  items.forEach(({st}) => {
    const c = toScreen(st.px, st.py);
    const w = cw * st.name.length + 4;
    const off = 10;
    const variants = [
      {dx: off, dy: 4, anchor: 'start'},
      {dx: -off, dy: 4, anchor: 'end'},
      {dx: 0, dy: -off, anchor: 'middle'},
      {dx: 0, dy: off + 11, anchor: 'middle'},
      {dx: off, dy: -off, anchor: 'start'},
      {dx: -off, dy: off + 11, anchor: 'end'}
    ];
    for (const v of variants){
      const bx = v.anchor === 'start' ? c.x + v.dx
              : v.anchor === 'end' ? c.x + v.dx - w
              : c.x + v.dx - w/2;
      const box = {x: bx - 1, y: c.y + v.dy - lh + 3, w: w + 2, h: lh};
      if (overlaps(box) || hitsDot(box, st.id)) continue;
      placed.push(box);
      const t = svgEl('text', {
        class: 'st-label' + (st.transfer ? ' hi' : ''),
        x: st.px + v.dx * u,
        y: st.py + v.dy * u,
        'text-anchor': v.anchor,
        'font-size': fs
      });
      t.textContent = st.name;
      gLabels.appendChild(t);
      break;
    }
  });
}

/* ------------------------ подсказка при наведении ------------------------- */
const tip = $('tooltip');
svg.addEventListener('pointerover', (e) => {
  const g = e.target.closest && e.target.closest('.station');
  if (!g) return;
  const st = nearestStation(e.clientX, e.clientY) || (stationNodes.get(g.dataset.id) || {}).st;
  if (!st) return;
  const rec = stationNodes.get(st.id) || depotNodes.get(st.id);
  const rooms = st.groups.reduce((a,v) => a + v.rooms.length, 0);
  const sys = st.groups.reduce((a,v) => a + v.rooms.reduce((b,r) => b + roomSystems(r).length, 0), 0);
  const bad = st.groups.reduce((a,v) => a + v.rooms.reduce((b,r) =>
    b + roomSystems(r).filter(x => stateClass(x.state) === 'bad').length, 0), 0);
  const L = lineOf(st);
  tip.innerHTML = `<b>${esc(st.name)}</b><br><small><span style="color:${esc(L.color)}">●</span> ${esc(L.name)}`
    + (st.transfer ? ` · пересадка: ${esc(st.transfer)}` : '')
    + `<br>${rooms} ${plural(rooms,'помещение','помещения','помещений')}`
    + ` · ${sys} ${plural(sys,'единица','единицы','единиц')} оборудования`
    + (bad ? ` · <span style="color:#ff9a8f">неисправно ${bad}</span>` : '')
    + (ONLINE.ready ? (() => { const di = diagramInfoForStation(st.id);
        return di.count ? `<br>схем: ${di.count}` + (di.overdue
          ? ` · <span style="color:#ff9a8f">просрочено ${di.overdue}</span>` : ' · все актуальны') : '';
      })() : '')
    + `</small>`;
  const r = rec.body.getBoundingClientRect(), mr = $('mapArea').getBoundingClientRect();
  tip.style.left = (r.left - mr.left + r.width/2) + 'px';
  tip.style.top = (r.top - mr.top) + 'px';
  tip.style.opacity = 1;
});
svg.addEventListener('pointerout', (e) => {
  if (e.target.closest && e.target.closest('.station')) tip.style.opacity = 0;
});

/* ------------------------------ фокус линии ------------------------------- */
function setFocus(id){
  focusLineId = id;
  document.querySelectorAll('.line-chip').forEach(c =>
    c.classList.toggle('on', c.dataset.line === id));
  updateScale();
}
function toggleFocus(id){
  if (focusLineId === id){ setFocus(null); fitAll(); }
  else { setFocus(id); fitLine(id); }
}

/* --------------------------- модальное окно ------------------------------- */
const overlay = $('overlay'), mTitle = $('mTitle'), mSub = $('mSub'),
      mBody = $('mBody'), mFoot = $('mFoot'), mSteps = $('mSteps'), crumb = $('crumb');
let state = {station:null, group:null, room:null, highlight:null};
let GROUP_WORD = 'Раздел';      // «Вестибюль» / «Раздел» / «Объект» — зависит от данных
function setGroupWord(st){
  if (st && st.offMap) GROUP_WORD = 'Объект';
  else if (st && st.groups.length && st.groups.every(g => /вестибюл/i.test(g.name))) GROUP_WORD = 'Вестибюль';
  else GROUP_WORD = 'Раздел';
}

function openModal(){ overlay.classList.add('open'); }
/* возврат на шаг назад: к карте, к станции, к разделам */
function goBack(){
  if ($('editOverlay') && $('editOverlay').classList.contains('open')){ closeEdit(); return; }
  const overlay = $('mBack') ? $('mBack').closest('.overlay') : null;
  if (state.room && state.group){ state.room = null; gotoGroup(state.station, state.group); return; }
  if (state.group && state.station){ state.group = null; gotoStation(state.station, { forceCard: true }); return; }
  closeModal();
}
function closeModal(){
  overlay.classList.remove('open');
  state = {station:null, group:null, room:null, highlight:null};
}
$('mClose').onclick = closeModal;
overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
});

function lineTag(st){
  const L = lineOf(st);
  return `<span class="line-tag"><i style="background:${esc(L.color)}"></i>${esc(L.name)}</span>`;
}
function setCrumb(parts){
  crumb.innerHTML = parts.map((p, i) => {
    const last = i === parts.length - 1;
    if (last || !p.act) return `<span class="${last ? 'cur' : ''}">${esc(p.label)}</span>`;
    return `<button data-act="${p.act}">${esc(p.label)}</button>`;
  }).join('<span>›</span>');
  crumb.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      const st = state.station;
      if (b.dataset.act === 'line'){
        closeModal();
        if (st){ setFocus(st.lineId); fitLine(st.lineId); }
        else { setFocus(null); fitAll(); }
      }
      if (b.dataset.act === 'station') gotoStation(state.station, {forceCard:true});
      if (b.dataset.act === 'group') gotoGroup(state.station, state.group);
    };
  });
}
function setPips(step){
  const names = ['Станция', GROUP_WORD, 'Оборудование'];
  if (!step){ mSteps.innerHTML = ''; mSteps.style.display = 'none'; return; }
  mSteps.style.display = '';
  mSteps.innerHTML = names.map((n, i) => {
    const cls = i + 1 < step ? 'done' : (i + 1 === step ? 'now' : '');
    return `<span class="pip ${cls}"><i>${i+1}</i>${n}</span>`;
  }).join('<span style="color:#c7d1dc">—</span>');
}

/* Шаг 1: станция -> выбор группы помещений (вестибюль, раздел, объект) */
function gotoStation(st, opts){
  setGroupWord(st);
  if (st.groups.length === 1 && !(opts && opts.forceCard)){
    return gotoGroup(st, st.groups[0]);
  }
  state = {station:st, group:null, room:null, highlight:(opts && opts.highlight) || null};
  const rooms = st.groups.reduce((a,v) => a + v.rooms.length, 0);
  const sys = st.groups.reduce((a,v) => a + v.rooms.reduce((b,r) => b + roomSystems(r).length, 0), 0);
  const bad = st.groups.reduce((a,v) => a + v.rooms.reduce((b,r) =>
    b + roomSystems(r).filter(x => stateClass(x.state) === 'bad').length, 0), 0);
  setCrumb([{label: lineOf(st).name, act:'line'}, {label: st.name}]);
  mTitle.textContent = st.name;
  const par = st.parentId ? STATION_BY_ID[st.parentId] : null;
  mSub.innerHTML = st.offMap
    ? `${lineTag(st)} · депо / объект${par ? ` · рядом со станцией ${esc(par.name)}` : ''}`
    : `${lineTag(st)} · станция № ${st.number}`
      + (st.code ? ` · код ${esc(st.code)}` : '')
      + (st.opened ? ` · открыта в ${esc(st.opened)}` : '')
      + (st.transfer ? ` · пересадка: ${esc(st.transfer)}` : '');
  setPips(st.groups.length > 1 ? 1 : 1);
  mBody.innerHTML = `
    <div class="chips" style="margin:0 0 14px">
      <span class="chip">${rooms} ${plural(rooms,'помещение','помещения','помещений')}</span>
      <span class="chip">${sys} ${plural(sys,'единица','единицы','единиц')} оборудования</span>
      ${bad ? `<span class="chip" style="background:var(--bad-bg);border-color:#f3c9c6;color:var(--bad)">${bad} неисправных</span>` : ''}
    </div>
    <div class="grid">
      ${st.groups.map(v => {
        const vr = v.rooms.length;
        const vs = v.rooms.reduce((a,r) => a + roomSystems(r).length, 0);
        const vb = v.rooms.reduce((a,r) => a + roomSystems(r).filter(x => stateClass(x.state) === 'bad').length, 0);
        const isOut = v.name === OUTDOOR_GROUP;
        return `<button class="card" data-grp="${esc(v.id)}">
          <div class="c-top"><span class="c-name">${esc(v.name)}</span><span class="chip">${vr} пом.</span></div>
          ${isOut ? '<div class="c-sub" style="color:#2f6fb0">Здесь размещают наружные блоки кондиционеров</div>' : ''}
          <div class="c-meta"><span>Оборудование: <b>${vs}</b></span>
            ${vb ? `<span style="color:var(--bad)">неисправно: <b>${vb}</b></span>` : ''}</div>
          <div class="c-sub" style="color:var(--accent)">Открыть помещения →</div>
        </button>`;
      }).join('') || `<div class="empty">По этой станции данных об оборудовании в книге нет.</div>`}
    </div>`;
  mBody.querySelectorAll('[data-grp]').forEach(b => {
    b.onclick = () => gotoGroup(st, st.groups.find(x => x.id === b.dataset.grp));
  });
  // онлайн: схемы приходят из базы; офлайн: из встроенных данных
  const roomDiagrams = stationDiagrams(st);
  if (roomDiagrams.length){
    const dbox = document.createElement('div');
    dbox.className = 'asm-block';
    dbox.innerHTML = `<div class="asm-head"><h3>Однолинейные схемы</h3>
        <span class="chip">${roomDiagrams.length} ${plural(roomDiagrams.length, 'схема', 'схемы', 'схем')}</span></div>
      <div class="grid">${roomDiagrams.map((d, i) => `
        <button class="card asmcard" data-diagram="${i}">
          <div class="c-top"><span class="c-name">${esc(d.title || 'Однолинейная схема')}</span>
            <span class="chip">PDF</span></div>
          <div class="c-sub">${d.room ? 'пом. ' + esc(d.room) + (d.place ? ' · ' + esc(d.place) : '') : 'привязка к помещению не указана'}</div>
          <div class="c-sub">дата схемы: <b>${fmtDate(d.date)}</b> ${diaBadge(d.date)}
            ${d.date ? `<br>действует до ${fmtDate(datePlusMonths(d.date, SCHEMA_MAX_MONTHS))}` : ''}</div>
          <div class="c-sub" style="color:var(--accent)">Открыть схему →</div>
        </button>`).join('')}</div>
      <div class="note">Схемы встроены в файл карты — открываются на любом устройстве, интернет не нужен.</div>`;
    dbox.querySelectorAll('[data-diagram]').forEach(b => b.onclick = () => openDiagram(roomDiagrams[+b.dataset.diagram]));
    mBody.appendChild(dbox);

    const box = document.createElement('div');
    box.className = 'asm-block';
    box.innerHTML = assembliesBlock(st);
    mBody.appendChild(box);
    wireAssembliesBlock();
  }
  mFoot.innerHTML = `<span class="note">Шаг 1 из 3 — выберите раздел, чтобы перейти к помещениям и оборудованию.</span>`;
  openModal();
}

/* Шаг 2: раздел -> номера помещений */
function gotoGroup(st, v){
  state.station = st; state.group = v; state.room = null;
  setGroupWord(st);
  setCrumb([{label: lineOf(st).name, act:'line'}, {label: st.name, act:'station'}, {label: v.name}]);
  mTitle.textContent = `${st.name} — ${v.name}`;
  mSub.innerHTML = `${lineTag(st)} · ${v.rooms.length} ${plural(v.rooms.length,'помещение','помещения','помещений')} · ${v.rooms.reduce((a,r) => a + roomSystems(r).length, 0)} ${plural(v.rooms.reduce((a,r) => a + roomSystems(r).length, 0),'единица','единицы','единиц')} оборудования`;
  setPips(2);
  const sys = v.rooms.reduce((a,r) => a + roomSystems(r).length, 0);
  mBody.innerHTML = `
    <div class="filter-row">
      <input id="roomFilter" type="search" placeholder="Номер помещения или место (ДСП, НБ, касса…)…" autocomplete="off">
      <span class="chip">${v.rooms.length} помещений</span>
      <span class="chip">${sys} единиц оборудования</span>
    </div>
    <div class="rooms" id="roomsGrid"></div>
    <div class="note">Шаг 2 из 3 — нажмите помещение, чтобы увидеть оборудование и инвентарные номера.</div>`;

  const grid = $('roomsGrid');
  function draw(filter){
    const f = (filter || '').trim().toLowerCase();
    const list = v.rooms.filter(r => !f || r.number.toLowerCase().includes(f)
      || (r.place || '').toLowerCase().includes(f));
    if (!list.length){
      grid.className = '';
      grid.innerHTML = `<div class="empty">Ничего не найдено по запросу «${esc(filter)}»</div>`;
      return;
    }
    grid.className = 'rooms';
    grid.innerHTML = list.map(r => {
      const list2 = roomSystems(r);
      const n = list2.length;
      const bad = list2.filter(x => stateClass(x.state) === 'bad').length;
      const mark = state.highlight && list2.some(s => s.inv === state.highlight || s.mark === state.highlight);
      return `<button class="room" data-room="${esc(r.id)}">
        <span class="r-num">${esc(roomLabel(r))}</span>
        <span class="r-purpose">${esc(r.place || '')}${(r.places && r.places.length > 1)
          ? `<span class="more" title="${esc(r.places.join(' · '))}"> +${r.places.length - 1}</span>` : ''}</span>
        <span class="r-badge ${bad ? 'hit' : (n ? (mark ? 'hit' : '') : 'none')}">${bad ? bad + ' неисправно' : (n ? n + ' ' + plural(n,'ед.','ед.','ед.') : 'нет оборудования')}</span>
      </button>`;
    }).join('');
    grid.querySelectorAll('[data-room]').forEach(b => {
      b.onclick = () => gotoRoom(st, v, v.rooms.find(x => x.id === b.dataset.room));
    });
  }
  draw('');
  const fi = $('roomFilter');
  fi.addEventListener('input', () => draw(fi.value));
  fi.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ const f = grid.querySelector('[data-room]'); if (f) f.click(); }
  });
  setTimeout(() => fi.focus(), 40);
  mFoot.innerHTML = `<button class="btn" id="backToStation">← К разделам станции</button>
    <span class="note">Шаг 2 из 3 — выбор помещения.</span>`;
  $('backToStation').onclick = () => gotoStation(st);
  openModal();
}

/* Шаг 3: помещение -> оборудование с инвентарными номерами */
function gotoRoom(st, v, r, highlight){
  const has = (s, h) => h && (s.inv === h || s.mark === h);
  const keep = highlight || (state.highlight && r.systems.some(s => has(s, state.highlight)) ? state.highlight : null);
  state.station = st; state.group = v; state.room = r; state.highlight = keep;
  const lab = roomLabel(r);
  const title = lab === r.place ? lab : `Помещение ${lab}`;
  setCrumb([{label: lineOf(st).name, act:'line'}, {label: st.name, act:'station'},
            {label: v.name, act:'group'}, {label: title}]);
  mTitle.textContent = r.place ? `${title} — ${r.place}` : title;
  const placesAll = (r.places && r.places.length > 1) ? r.places : null;
  mSub.innerHTML = `${lineTag(st)} · ${esc(st.name)} · ${esc(v.name)}`
    + (v.name === OUTDOOR_GROUP ? ' · <span style="color:#2f6fb0">техническое помещение для наружных блоков</span>' : '')

    + (placesAll ? `<br>Места в книге: ${placesAll.map(x => esc(x)).join(' · ')}` : '');
  setPips(3);

  const list = roomSystems(r);
  const bad = list.filter(x => stateClass(x.state) === 'bad').length;
  const rows = list.map((x, i) => `
    <tr class="${(keep && has(x, keep)) ? 'mark' : ''}">
      <td>${i + 1}</td>
      <td>${esc(x.mark || '—')}</td>
      <td>${esc(x.type || '—')}</td>
      <td>${esc(x.model || '—')}</td>
      <td class="inv">${esc(x.inv || '—')}</td>
      <td>${esc(x.power || '—')}</td>
      <td><span class="badge ${stateClass(x.state)}" title="${esc(x.state || '')}">${esc(shortState(x.state))}</span></td>
      <td>${esc(x.installed || '—')}</td>
      <td>${esc(x.service || '—')}</td>
      <td>${esc(x.drain || '—')}${(x.supply || x.breaker)
        ? `<br><small style="color:var(--muted)">${esc([x.supply, x.breaker].filter(Boolean).join(' · '))}</small>` : ''}</td>
      <td>${esc(x.responsible || '—')}${x.phone ? `<br><small style="color:var(--muted)">${esc(x.phone)}</small>` : ''}</td>
      <td>${esc(x.num || '—')}</td>
      <td>${x.verifiedAt
        ? `<span class="chk" title="${escAttr(x.verifyNote || '')}">✓ ${esc(String(x.verifiedAt).slice(0, 10))}</span>`
        : '<span class="chk no">—</span>'}</td>
      <td>${rowActions(x)}</td>
    </tr>`).join('');

  mBody.innerHTML = list.length ? `
    <div style="overflow:auto">
      <table class="tbl">
        <thead><tr>
          <th>№</th><th>Маркировка</th><th>Тип</th><th>Марка / модель</th><th>Инвентарный номер</th>
          <th>Мощность</th><th>Состояние</th><th>Дата</th><th>Служба</th>
          <th>Дренаж / питание / автомат</th><th>Ответственный / телефон</th><th>№ АБКиСК</th>
          <th>Сверка</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="note">${list.length} ${plural(list.length,'единица','единицы','единиц')} оборудования`
      + (bad ? `, из них <b style="color:var(--bad)">${bad} неисправно</b>` : ', все исправны')
      + `. Наведите на состояние — видна полная запись из книги.</div>`
  : `<div class="empty"><b>Оборудование не числится</b><br>
       По помещению ${esc(r.number)} записей в книге оборудования нет.</div>`;

  mFoot.innerHTML = `
    <button class="btn" id="backToVest">← К помещениям «${esc(v.name)}»</button>
    ${canEdit() ? '<button class="btn" id="addEq">+ Добавить оборудование</button>' : ''}
    <span class="spacer"></span>
    ${list.length ? `<button class="btn" id="exportRoom">Экспорт помещения в CSV</button>
    <button class="btn primary" id="printRoom">Печать / PDF</button>` : ''}`;
  $('backToVest').onclick = () => gotoGroup(st, v);
  if (canEdit()) $('addEq').onclick = () => openEquipmentForm(null);
  mBody.querySelectorAll('[data-card]').forEach(b => b.onclick = () => openCard(eqById(b.dataset.card)));
  mBody.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEquipmentForm(eqById(b.dataset.edit)));
  mBody.querySelectorAll('[data-verify]').forEach(b => b.onclick = () => setVerified(eqById(b.dataset.verify), true));
  if (list.length){
    $('exportRoom').onclick = () => exportCsv(rowsForRoom(st, v, r),
      `pomeschenie-${st.lineId}-${st.number}-${(r.number || 'x').replace(/[^\wа-яА-Я0-9-]+/g, '_')}.csv`);
    $('printRoom').onclick = () => window.print();
  }
  openModal();
}

/* ------------------------- сбор строк для экспорта ------------------------ */
function rowsForRoom(st, v, r){
  return roomSystems(r).map(x => ({
    stationId: st.id, groupId: v.id, roomId: r.id,
    line: lineOf(st).name, station: st.name, offMap: st.offMap ? 'вне схемы' : '',
    group: v.name, place: (r.places && r.places.length > 1 ? r.places.join(' · ') : (r.place || '')), room: r.number || '',
    mark: x.mark || '', type: x.type || '', model: x.model || '', inv: x.inv || '',
    power: x.power || '', state: x.state || '', installed: x.installed || '',
    service: x.service || '', drain: x.drain || '', supply: x.supply || '', breaker: x.breaker || '',
    responsible: x.responsible || '', phone: x.phone || '', num: x.num || ''
  }));
}
function allRows(){
  const out = [];
  STATIONS.forEach(st => st.groups.forEach(v => v.rooms.forEach(r => out.push(...rowsForRoom(st, v, r)))));
  return out;
}
const CSV_HEAD = ['Линия','Станция','Примечание','Раздел','Место','Помещение','Маркировка','Тип',
  'Марка/модель','Инвентарный номер','Мощность','Состояние','Дата','Служба','Дренаж','Питание',
  'Промежуточный автомат','Ответственный','Телефон','№ АБКиСК'];
function exportCsv(rows, filename){
  const lines = [CSV_HEAD.join(';')];
  rows.forEach(r => lines.push([
    r.line, r.station, r.offMap, r.group, r.place, r.room, r.mark, r.type, r.model, r.inv,
    r.power, r.state, r.installed, r.service, r.drain, r.supply, r.breaker, r.responsible, r.phone, r.num
  ].map(x => `"${String(x == null ? '' : x).replace(/"/g,'""')}"`).join(';')));
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ------------------------- реестр всего оборудования ---------------------- */

        <th>Маркировка</th><th>Тип</th><th>Марка / модель</th><th>Инв. номер</th><th>Состояние</th></tr></thead>
      <tbody>${rows.map(r => `<tr data-id="${esc(r.stationId)}" data-g="${esc(r.groupId)}" data-r="${esc(r.roomId)}" style="cursor:pointer">

        <td>${esc(r.station)}${r.offMap ? ' <span class="chip" style="padding:0 6px">вне схемы</span>' : ''}</td>
        <td>${esc(r.group)}</td><td>${esc(r.place)}</td><td class="inv">${esc(r.room)}</td>

    $('regTable').querySelectorAll('tr[data-id]').forEach(tr => {

  $('backToMap').onclick = closeModal;
  $('regExport').onclick = () => exportCsv(rows0, 'reestr-oborudovaniya-sk.csv');

/* -------------------------------- поиск ---------------------------------- */
const searchInput = $('search'), searchResults = $('searchResults');
const INDEX = (() => {
  const idx = [];
  STATIONS.forEach(st => {
    const L = lineOf(st);
    const where = st.offMap ? 'вне схемы' : `станция № ${st.number}`;
    idx.push({kind:'st', label: st.name, sub: `${L.name} · ${where}`, st,
              hay: `${st.name} ${L.name} ${st.transfer || ''} ${st.code || ''} ${st.offMap ? 'депо абк вне схемы' : ''}`.toLowerCase()});
    st.groups.forEach(v => v.rooms.forEach(r => {
      const num = roomLabel(r);
      const n = roomSystems(r).length;
      idx.push({kind:'rm', label: `Помещение ${num}${r.place ? ' — ' + r.place : ''}`,
                sub: `${L.name} · ${st.name} · ${v.name} · ${n} ед. оборудования`, st, v, r,
                hay: `${r.number} ${(r.places || [r.place]).join(' ')} ${st.name} ${v.name} ${L.name}`.toLowerCase()});
      roomSystems(r).forEach(x => idx.push({
        kind:'eq', label: `${x.mark ? x.mark + ' · ' : ''}${x.type || ''} ${x.model || ''}`.trim(),
        sub: `${L.name} · ${st.name} · ${r.number && r.number !== '—' ? 'пом. ' + r.number : r.place}`
             + (x.inv ? ` · инв. ${x.inv}` : '') + (x.state ? ` · ${x.state}` : ''),
        st, v, r, inv: x.inv || x.mark,
        hay: (`${x.inv || ''} ${x.model || ''} ${x.mark || ''} ${x.type || ''} ${x.state || ''} ${x.breaker || ''} `
              + `${st.name} ${r.number} ${r.place} ${L.name}`).toLowerCase()
      }));
    }));
  });
  return idx;
})();
function runSearch(q){
  const f = q.trim().toLowerCase();
  if (f.length < 2) return [];
  const st = [], rm = [], eq = [];
  for (const it of INDEX){
    if (!it.hay.includes(f)) continue;
    if (it.kind === 'st') st.push(it);
    else if (it.kind === 'rm') rm.push(it);
    else eq.push(it);
    if (st.length + rm.length + eq.length >= 80) break;
  }
  return st.concat(rm, eq).slice(0, 60);
}
function renderSearchResults(list, q){
  if (!q || q.trim().length < 2){ searchResults.classList.remove('open'); searchResults.innerHTML = ''; return; }
  if (!list.length){

const ROLE_HINT = {

};

function eqById(id){ return ONLINE.rows.find(r => r.id === id); }
